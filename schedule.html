<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排程看板</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1714">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 老闆排程用：上方摘要 → 還沒排程（照交貨日，快到期標色）→ 今天 → 明天 → 之後 */
:root{
  --bg:#f5f2ed; --surface:#fff; --ink:#1a1714; --ink-2:#6b6560; --line:#d6cfc4;
  --accent:#c0392b; --accent-soft:#fdf0ef; --ok:#2e7d32; --ok-soft:#eef6ee;
  --warn:#b7770d; --warn-soft:#fdf6e8; --chip:#ece8e2;
  --sans:'Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;font-weight:900}
.meta{font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta a,.meta button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--ink);text-decoration:none}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sum a{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.sum b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--ink-2)}
.sum .alert{border-color:var(--accent);background:var(--accent-soft)}
.sum .alert span{color:var(--accent);font-weight:700}
.msg{padding:10px 14px;border-radius:4px;font-size:14px}
.msg.err{background:var(--accent-soft);color:var(--accent);border:1px solid #ef9a9a}
section h2{font-size:20px;font-weight:900;margin:0 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section h2 small{font-size:13px;color:var(--ink-2);font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.row.rush{border-left:6px solid var(--accent)}
.row.late{background:var(--accent-soft)}
.info{display:flex;flex-direction:column;gap:3px;min-width:0}
.l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cust{font-size:17px;font-weight:900}
.prod{font-size:15px;overflow-wrap:anywhere}
.l2{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);align-items:center}
.l2 .mono{font-family:var(--mono);color:var(--ink);font-weight:600}
.due{font-weight:700}
.due.late{color:var(--accent)}
.due.soon{color:var(--warn)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.rush{background:var(--accent);color:#fff}
.pill.kind{background:var(--ink);color:#fff}
.pill.carry{background:var(--warn-soft);color:var(--warn)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{font-size:11px;padding:1px 5px;border-radius:3px;background:var(--chip);color:var(--ink-2)}
.dot.doing{background:var(--warn);color:#fff}
.dot.done{background:var(--ok);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button,.acts label{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:5px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.acts .go{background:var(--ink);color:#fff}
.acts .rush-on{border-color:var(--accent);background:var(--accent);color:#fff}
.acts .light{border-color:var(--line);color:var(--ink-2);font-weight:500}
.acts label{position:relative;overflow:hidden}
.acts input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer}
.acts button:disabled{opacity:.4}
button:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.empty{padding:18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:6px;font-size:14px}
.day{font-size:15px;font-weight:700;margin:10px 0 4px;color:var(--ink-2)}
@media (max-width:720px){.row{grid-template-columns:1fr}.acts{justify-content:flex-start}.sum{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>排程看板</h1>
    <div class="meta">
      <span id="updated">載入中…</span>
      <button onclick="load()">重新整理</button>
      <a href="board.html">工站看板</a>
      <a href="labels.html">印小標</a>
    </div>
  </div>
  <div class="sum" id="sum"></div>
  <div id="msg"></div>
  <section id="sec-un"><h2>還沒排程 <small>照交貨日排，紅色＝已過交期，橘色＝3 天內要交</small></h2><div class="list" id="un"></div></section>
  <section id="sec-today"><h2 id="h-today">今天</h2><div class="list" id="today"></div></section>
  <section id="sec-tmr"><h2 id="h-tmr">明天</h2><div class="list" id="tmr"></div></section>
  <section id="sec-later"><h2>之後</h2><div id="later"></div></section>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXvT3OkQoOKZ2XmmrtFBKhxg9OuTCphL66klI1sJBeSqczxUuKhCZZKMdzzXN_AqJ3/exec';
const STATIONS = ['裁切','印刷','開槽','釘箱','出貨'];
const WEEK = '日一二三四五六';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let orders = [];

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }
function label(k){ const d=new Date(k+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）`; }
function daysTo(k){ if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return null; return Math.round((new Date(k+'T00:00:00') - new Date(addDays(0)+'T00:00:00'))/864e5); }
const byPriority = (a,b) => (b.rush-a.rush) || String(a.dueKey||'9').localeCompare(String(b.dueKey||'9'));

async function load(){
  try{
    const res = await fetch(GAS_URL + '?action=getSchedule');
    const d = await res.json();
    if(!d.success) throw new Error(d.error || '讀取失敗');
    orders = d.data;
    $('msg').innerHTML = '';
    $('updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('msg').innerHTML = `<div class="msg err">連不到試算表：${esc(e.message)}</div>`;
  }
  render();
}

function render(){
  const T = addDays(0), M = addDays(1);
  const un = orders.filter(o => !o.sched).sort((a,b) => String(a.dueKey||'9').localeCompare(String(b.dueKey||'9')));
  const today = orders.filter(o => o.sched && o.sched <= T).sort(byPriority);
  const tmr = orders.filter(o => o.sched === M).sort(byPriority);
  const later = orders.filter(o => o.sched && o.sched > M).sort((a,b) => a.sched.localeCompare(b.sched) || byPriority(a,b));
  const late = un.filter(o => (daysTo(o.dueKey) ?? 99) < 0).length;
  const soon = un.filter(o => { const n = daysTo(o.dueKey); return n !== null && n >= 0 && n <= 3; }).length;

  $('sum').innerHTML = `
    <a href="#sec-un" class="${late||soon?'alert':''}"><b>${un.length}</b><span>還沒排${late?`・${late} 張過交期`:soon?`・${soon} 張快到期`:''}</span></a>
    <a href="#sec-today"><b>${today.length}</b><span>今天</span></a>
    <a href="#sec-tmr"><b>${tmr.length}</b><span>明天</span></a>
    <a href="#sec-later"><b>${later.length}</b><span>之後</span></a>`;
  $('h-today').innerHTML = `今天 <small>${label(T)}</small>`;
  $('h-tmr').innerHTML = `明天 <small>${label(M)}</small>`;

  $('un').innerHTML = un.length ? un.map(o => row(o,'un')).join('') : '<div class="empty">全部都排好了</div>';
  $('today').innerHTML = today.length ? today.map(o => row(o,'today')).join('') : '<div class="empty">今天還沒有排單，從上面「還沒排程」按「排今天」</div>';
  $('tmr').innerHTML = tmr.length ? tmr.map(o => row(o,'tmr')).join('') : '<div class="empty">明天還沒有排單</div>';
  if(!later.length){ $('later').innerHTML = '<div class="empty">沒有</div>'; return; }
  let html = '', cur = '';
  later.forEach(o => { if(o.sched !== cur){ if(cur) html += '</div>'; cur = o.sched; html += `<div class="day">${label(cur)}</div><div class="list">`; } html += row(o,'later'); });
  $('later').innerHTML = html + '</div>';
}

function row(o, where){
  const n = daysTo(o.dueKey);
  const dueCls = n === null ? '' : n < 0 ? 'late' : n <= 3 ? 'soon' : '';
  const dueTxt = n === null ? (o.due || '－') : n < 0 ? `${o.due}（過 ${-n} 天）` : n === 0 ? `${o.due}（今天）` : `${o.due}（${n} 天後）`;
  const carry = where === 'today' && o.sched < addDays(0) ? `<span class="pill carry">${label(o.sched)} 排的，還沒做完</span>` : '';
  const dots = where === 'un' ? '' : `<span class="dots">${o.route.map(i => `<span class="dot ${o.prog[i]||''}">${STATIONS[i]}</span>`).join('')}</span>`;
  const id = esc(o.no);
  const dateBtn = `<label>${where==='un'?'選日期':'改日期'}<input type="date" aria-label="選排程日期" onchange="setSched('${id}', this.value)"></label>`;
  const rushBtn = `<button class="${o.rush?'rush-on':''}" onclick="toggleRush('${id}')">${o.rush?'急件 ✓':'急件'}</button>`;
  let acts;
  if(where === 'un') acts = `<button class="go" onclick="setSched('${id}', addDays(0))">排今天</button><button onclick="setSched('${id}', addDays(1))">排明天</button>${dateBtn}${rushBtn}<button class="light" onclick="shipped('${id}')">已出貨</button>`;
  else if(where === 'today') acts = `<button onclick="setSched('${id}', addDays(1))">改明天</button>${dateBtn}${rushBtn}<button class="light" onclick="setSched('${id}', '')">取消排程</button>`;
  else acts = `<button class="go" onclick="setSched('${id}', addDays(0))">提前到今天</button>${dateBtn}${rushBtn}<button class="light" onclick="setSched('${id}', '')">取消排程</button>`;
  return `<div class="row ${o.rush?'rush':''} ${where==='un'&&n!==null&&n<0?'late':''}">
    <div class="info">
      <div class="l1"><span class="cust">${esc(o.cust)}</span><span class="prod">${esc(o.prod)}</span>
        ${o.rush?'<span class="pill rush">急件</span>':''}${o.kind!=='釘箱'?`<span class="pill kind">${esc(o.kind)}</span>`:''}${carry}</div>
      <div class="l2"><span class="mono">${esc(o.size)}</span><span>${esc(o.qty)}</span>
        <span class="due ${dueCls}">交貨 ${esc(dueTxt)}</span>${dots}</div>
    </div>
    <div class="acts">${acts}</div>
  </div>`;
}

async function post(body){
  const res = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  const d = await res.json();
  if(!d.success) throw new Error(d.error || '寫入失敗');
}
async function change(no, apply, body){
  const o = orders.find(x => x.no === no); if(!o) return;
  const before = {...o};
  apply(o); render();                     // 畫面先變，不用等
  try{ await post(body); }
  catch(e){ Object.assign(o, before); render(); $('msg').innerHTML = `<div class="msg err">沒存到：${esc(e.message)}，請再按一次。</div>`; }
}
function setSched(no, date){ change(no, o => { o.sched = date; }, {action:'setSchedule', orderId:no, schedDate:date}); }
function toggleRush(no){ const o = orders.find(x => x.no === no); change(no, x => { x.rush = !x.rush; }, {action:'setSchedule', orderId:no, rush:!o.rush}); }
async function shipped(no){
  orders = orders.filter(x => x.no !== no); render();
  try{ await post({action:'updateOrderStatus', orderId:no, status:'已出貨'}); }
  catch(e){ $('msg').innerHTML = `<div class="msg err">沒存到：${esc(e.message)}</div>`; load(); }
}

load();
setInterval(load, 120000);
</script>
</body>
</html>
