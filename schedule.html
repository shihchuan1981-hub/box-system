<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排程看板</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1714">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 老闆排程用：上方摘要 → 還沒排程（照交貨日，快到期標色）→ 今天 → 明天 → 之後 */
:root{
  --bg:#f5f2ed; --surface:#fff; --ink:#1a1714; --ink-2:#6b6560; --line:#d6cfc4;
  --accent:#c0392b; --accent-soft:#fdf0ef; --ok:#2e7d32; --ok-soft:#eef6ee;
  --warn:#b7770d; --warn-soft:#fdf6e8; --chip:#ece8e2;
  --sans:'Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:0;font-weight:900}
.meta{font-size:13px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta a,.meta button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;color:var(--ink);text-decoration:none}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sum a{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.sum b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--ink-2)}
.sum .bad{border-color:var(--accent);background:var(--accent-soft)}
.sum .bad b,.sum .bad span{color:var(--accent)}
.sum .bad span{font-weight:700}
.sum .good{border-color:#a5d6a7;background:var(--ok-soft)}
.sum .good b,.sum .good span{color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:-8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.msg{padding:10px 14px;border-radius:4px;font-size:14px}
.msg.err{background:var(--accent-soft);color:var(--accent);border:1px solid #ef9a9a}
section h2{font-size:20px;font-weight:900;margin:0 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
section h2 small{font-size:13px;color:var(--ink-2);font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.row.rush{border-left:6px solid var(--accent)}
.row.late{background:var(--accent-soft)}
.info{display:flex;flex-direction:column;gap:3px;min-width:0}
.l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cust{font-size:17px;font-weight:900}
.prod{font-size:15px;overflow-wrap:anywhere}
.l2{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);align-items:center}
.l2 .mono{font-family:var(--mono);color:var(--ink);font-weight:600}
.due{font-weight:700}
.due.bad{color:var(--accent)}
.due.good{color:var(--ok)}
.order.good{border-left:6px solid var(--ok)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.rush{background:var(--accent);color:#fff}
.pill.kind{background:var(--ink);color:#fff}
.pill.carry{background:var(--warn-soft);color:var(--warn)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{font-size:11px;padding:1px 5px;border-radius:3px;background:var(--chip);color:var(--ink-2)}
.dot.doing{background:var(--warn);color:#fff}
.dot.done{background:var(--ok);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.acts button{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:5px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.acts .go{background:var(--ink);color:#fff}
.acts .rush-on{border-color:var(--accent);background:var(--accent);color:#fff}
.acts .light{border-color:var(--line);color:var(--ink-2);font-weight:500}
.acts button:disabled{opacity:.4}
button:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.empty{padding:18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:6px;font-size:14px}
.day{font-size:15px;font-weight:700;margin:10px 0 4px;color:var(--ink-2)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.order.rush{border-left:6px solid var(--accent)}
.order.bad .ohead{background:var(--accent-soft)}
.order.bad{border-left:6px solid var(--accent)}
.ohead{padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.ono{font-family:var(--mono);font-size:14px;color:var(--ink-2);font-weight:600}
.count{font-size:13px;color:var(--ink-2)}
.prog{display:inline-flex;gap:4px;flex-wrap:wrap}
.prog a{text-decoration:none}
.prog a:hover{outline:2px solid var(--ink);outline-offset:1px}
.golink{color:var(--ink);text-decoration:none;border-bottom:2px solid transparent}
.golink:hover{border-bottom-color:var(--ink)}
.prog span,.prog a{font-size:12px;padding:1px 6px;border-radius:3px;background:var(--chip);color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog .part{background:var(--warn-soft);color:var(--warn);font-weight:700}
.prog .all{background:var(--ok);color:#fff;font-weight:700}
.toggle{font:inherit;font-size:13px;color:var(--ink-2);background:none;border:none;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.items{border-top:1px solid var(--line);overflow-x:auto}
.items table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.items th,.items td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.items th{font-size:12px;color:var(--ink-2);font-weight:700;background:var(--bg)}
.items tr:last-child td{border-bottom:none}
.items .mono{font-family:var(--mono);font-weight:600}
.type{font-size:12px;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap}
.type.out{background:var(--ink);color:#fff}
.type.in{background:var(--chip);color:var(--ink)}
.idate{font:inherit;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.picker{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:6px;padding:6px 8px}
.picker input{font:inherit;font-size:15px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:#fff}
.picker button{font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:5px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.picker button.no{background:var(--surface);color:var(--ink-2);border-color:var(--line);font-weight:500}
@media (max-width:720px){.row,.ohead{grid-template-columns:1fr}.acts{justify-content:flex-start}.sum{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>排程看板</h1>
    <div class="meta">
      <span id="updated">載入中…</span>
      <button onclick="load()">重新整理</button>
      <a href="board.html">工站看板</a>
      <a href="labels.html">印小標</a>
    </div>
  </div>
  <div class="sum" id="sum"></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>綠＝已排程、趕得上交期</span><span><i style="background:var(--ink)"></i>黑＝一般</span><span><i style="background:var(--accent)"></i>紅＝要注意：過交期、3 天內要交還沒排、排的日期比交期晚</span></div>
  <div id="msg"></div>
  <section id="sec-un"><h2>還沒排程 <small>一張卡片＝一張訂單，照交貨日排</small></h2><div class="list" id="un"></div></section>
  <section id="sec-today"><h2 id="h-today">今天</h2><div class="list" id="today"></div></section>
  <section id="sec-tmr"><h2 id="h-tmr">明天</h2><div class="list" id="tmr"></div></section>
  <section id="sec-later"><h2>之後</h2><div id="later"></div></section>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXvT3OkQoOKZ2XmmrtFBKhxg9OuTCphL66klI1sJBeSqczxUuKhCZZKMdzzXN_AqJ3/exec';
const STATIONS = ['裁切','印刷','開槽','釘箱','出貨'];
const WEEK = '日一二三四五六';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let orders = [];

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }
function label(k){ const d=new Date(k+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）`; }
function daysTo(k){ if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return null; return Math.round((new Date(k+'T00:00:00') - new Date(addDays(0)+'T00:00:00'))/864e5); }
const byPriority = (a,b) => (b.rush-a.rush) || String(a.dueKey||'9').localeCompare(String(b.dueKey||'9'));

async function load(){
  try{
    const res = await fetch(GAS_URL + '?action=getSchedule');
    const d = await res.json();
    if(!d.success) throw new Error(d.error || '讀取失敗');
    orders = d.data;
    $('msg').innerHTML = '';
    $('updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    $('msg').innerHTML = `<div class="msg err">連不到試算表：${esc(e.message)}</div>`;
  }
  render();
}

// 同一張訂單的品項合在一起：有客戶單號用單號，沒有就用訂單ID去掉最後的 -1、-2
function groupKey(o){ return o.cust + '｜' + (o.orderNo || String(o.no).replace(/(-\d+)+$/,'')); }
function groupOf(list){
  const m = new Map();
  list.forEach(o => { const k = groupKey(o); if(!m.has(k)) m.set(k, []); m.get(k).push(o); });
  return [...m.entries()].map(([key, items]) => {
    items.sort((a,b) => (a.type===b.type?0:a.type==='內盒'?-1:1) || String(a.no).localeCompare(String(b.no), undefined, {numeric:true}));
    const dues = items.map(o => o.dueKey).filter(k => /^\d{4}-/.test(k)).sort();
    return { key, items, cust: items[0].cust, orderNo: items[0].orderNo, dueKey: dues[0] || '', due: (items.find(o => o.dueKey === dues[0]) || items[0]).due,
             rush: items.some(o => o.rush), sched: items.map(o => o.sched).filter(Boolean).sort()[0] || '' };
  });
}
// 綠＝排好了且趕得上；紅＝要注意；其他＝一般
function status(g){
  const n = daysTo(g.dueKey);
  if(n === null) return g.sched ? 'good' : 'normal';
  if(n < 0) return 'bad';                                   // 已過交期
  if(!g.sched) return n <= 3 ? 'bad' : 'normal';            // 快到期還沒排
  return g.sched > g.dueKey ? 'bad' : 'good';               // 排的日期比交期晚
}
function tile(groups, href, text, isSched){
  const bad = groups.filter(g => status(g) === 'bad').length;
  const cls = bad ? 'bad' : (isSched && groups.length ? 'good' : '');
  return `<a href="${href}" class="${cls}"><b>${groups.length}</b><span>${text}${bad?`・${bad} 張要注意`:''}</span></a>`;
}
const byDue = (a,b) => (b.rush-a.rush) || String(a.dueKey||'9').localeCompare(String(b.dueKey||'9'));
const open = new Set();
function toggle(id){ open.has(id) ? open.delete(id) : open.add(id); render(); }

function render(){
  const T = addDays(0), M = addDays(1);
  const un = groupOf(orders.filter(o => !o.sched)).sort((a,b) => String(a.dueKey||'9').localeCompare(String(b.dueKey||'9')));
  const today = groupOf(orders.filter(o => o.sched && o.sched <= T)).sort(byDue);
  const tmr = groupOf(orders.filter(o => o.sched === M)).sort(byDue);
  const laterItems = orders.filter(o => o.sched && o.sched > M);
  const days = [...new Set(laterItems.map(o => o.sched))].sort();
  const later = days.map(d => ({ d, groups: groupOf(laterItems.filter(o => o.sched === d)).sort(byDue) }));
  const nItems = g => g.reduce((n,x) => n + x.items.length, 0);
  const laterGroups = later.flatMap(x => x.groups);

  $('sum').innerHTML =
    tile(un, '#sec-un', `張單還沒排（${nItems(un)} 項）`, false) +
    tile(today, '#sec-today', `張單今天做（${nItems(today)} 項）`, true) +
    tile(tmr, '#sec-tmr', `張單明天（${nItems(tmr)} 項）`, true) +
    tile(laterGroups, '#sec-later', `張單之後（${laterItems.length} 項）`, true);
  $('h-today').innerHTML = `今天 <small>${label(T)}</small>`;
  $('h-tmr').innerHTML = `明天 <small>${label(M)}</small>`;

  $('un').innerHTML = un.length ? un.map(g => card(g,'un')).join('') : '<div class="empty">全部都排好了</div>';
  $('today').innerHTML = today.length ? today.map(g => card(g,'today')).join('') : '<div class="empty">今天還沒有排單，從上面「還沒排程」按「排今天」</div>';
  $('tmr').innerHTML = tmr.length ? tmr.map(g => card(g,'tmr')).join('') : '<div class="empty">明天還沒有排單</div>';
  $('later').innerHTML = later.length ? later.map(x => `<div class="day">${label(x.d)}</div><div class="list">${x.groups.map(g => card(g,'later')).join('')}</div>`).join('') : '<div class="empty">沒有</div>';
}

// 點進工站看板：只看這張訂單（可指定某一站）
function boardLink(g, station){
  const p = new URLSearchParams({ order: g.items.map(o => o.no).join(','), title: g.cust + (g.orderNo ? ' 單號 ' + g.orderNo : '') });
  if (station) p.set('station', station);
  return 'board.html?' + p.toString();
}
function card(g, where){
  const n = daysTo(g.dueKey);
  const st = status(g), dueCls = st === 'normal' ? '' : st;
  const lateSched = g.sched && g.dueKey && g.sched > g.dueKey && n !== null && n >= 0 ? '・排的日期比交期晚' : '';
  const dueTxt = n === null ? (g.due || '－') : n < 0 ? `${g.due}（過 ${-n} 天）` : n === 0 ? `${g.due}（今天）` : `${g.due}（${n} 天後）`;
  const nIn = g.items.filter(o => o.type === '內盒').length, nOut = g.items.length - nIn;
  const what = [nIn ? `內盒 ${nIn}` : '', nOut ? `外箱 ${nOut}` : ''].filter(Boolean).join('・');
  const carry = where === 'today' && g.sched < addDays(0) ? `<span class="pill carry">${label(g.sched)} 排的，還沒做完</span>` : '';
  const prog = where === 'un' ? '' : `<span class="prog">${STATIONS.map((s,i) => {
      const need = g.items.filter(o => o.route.includes(i)); if(!need.length) return '';
      const done = need.filter(o => o.prog[i] === 'done').length;
      return `<a href="${boardLink(g, s)}" target="boardTab" title="打開${s}站的看板" class="${done===need.length?'all':done||need.some(o=>o.prog[i])?'part':''}">${s} ${done}/${need.length}</a>`; }).join('')}</span>`;
  const gid = where + '｜' + g.key, ids = JSON.stringify(g.items.map(o => o.no)).replace(/"/g,'&quot;');
  const dateBtn = `<button onclick="pickDate(this, ${ids})">${where==='un'?'選日期':'改日期'}</button>`;
  const rushBtn = `<button class="${g.rush?'rush-on':''}" onclick="rushGroup(${ids}, ${!g.rush})">${g.rush?'急件 ✓':'急件'}</button>`;
  let acts;
  if(where === 'un') acts = `<button class="go" onclick="schedGroup(${ids}, addDays(0))">整張排今天</button><button onclick="schedGroup(${ids}, addDays(1))">排明天</button>${dateBtn}${rushBtn}<button class="light" onclick="shipGroup(${ids})">已出貨</button>`;
  else if(where === 'today') acts = `<button onclick="schedGroup(${ids}, addDays(1))">改明天</button>${dateBtn}${rushBtn}<button class="light" onclick="schedGroup(${ids}, '')">取消排程</button>`;
  else acts = `<button class="go" onclick="schedGroup(${ids}, addDays(0))">提前到今天</button>${dateBtn}${rushBtn}<button class="light" onclick="schedGroup(${ids}, '')">取消排程</button>`;
  const isOpen = open.has(gid) || g.items.length === 1;
  const rows = g.items.map(o => `<tr>
      <td><span class="type ${o.type==='內盒'?'in':'out'}">${o.type}</span></td>
      <td>${esc(o.prod)}${o.kind!=='釘箱'?` <span class="pill kind">${esc(o.kind)}</span>`:''}</td>
      <td class="mono">${esc(o.size)||'－'}</td><td>${esc(o.qty)||'－'}</td><td class="mono">${esc(o.material)||'－'}</td>
      <td>${where==='un'?'':`<span class="dots">${o.route.map(i => `<span class="dot ${o.prog[i]||''}">${STATIONS[i]}</span>`).join('')}</span>`}</td>
      <td><button class="idate" onclick="pickDate(this, ['${esc(o.no)}'])">${o.sched ? label(o.sched) : '只排這項'}</button></td>
    </tr>`).join('');
  return `<div class="order ${st==='bad'?'bad':st==='good'?'good':g.rush?'rush':''}">
    <div class="ohead">
      <div class="info">
        <div class="l1"><a class="cust golink" href="${boardLink(g)}" target="boardTab" title="打開工站看板，看這張單做到哪">${esc(g.cust)} ›</a>${g.orderNo?`<span class="ono">單號 ${esc(g.orderNo)}</span>`:''}
          ${g.rush?'<span class="pill rush">急件</span>':''}${carry}</div>
        <div class="l2"><span class="due ${dueCls}">交貨 ${esc(dueTxt)}${lateSched}</span><span class="count">${g.items.length} 項（${what}）</span>${prog}</div>
        ${g.items.length > 1 ? `<div><button class="toggle" onclick="toggle('${esc(gid)}')">${isOpen ? '收起品項 ▴' : `看 ${g.items.length} 個品項 ▾`}</button></div>` : ''}
      </div>
      <div class="acts">${acts}</div>
    </div>
    ${isOpen ? `<div class="items"><table><thead><tr><th>類型</th><th>品名</th><th>尺寸</th><th>數量</th><th>用紙</th><th>${where==='un'?'':'進度'}</th><th>排程</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
  </div>`;
}

async function post(body){
  const res = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)});
  const d = await res.json();
  if(!d.success) throw new Error(d.error || '寫入失敗');
}
async function change(nos, apply, body){
  const list = orders.filter(x => nos.includes(x.no)); if(!list.length) return;
  const before = list.map(o => ({...o}));
  list.forEach(apply); render();               // 畫面先變，不用等
  try{ await post(body); $('msg').innerHTML=''; }
  catch(e){ list.forEach((o,i) => Object.assign(o, before[i])); render(); $('msg').innerHTML = `<div class="msg err">沒存到：${esc(e.message)}，請再按一次。</div>`; }
}
// 選日期：在按鈕旁邊跳出一個看得見的日期框＋確定，電腦和手機都能用
function pickDate(btn, nos){
  document.querySelectorAll('.picker').forEach(p => p.remove());
  const box = document.createElement('span');
  box.className = 'picker';
  box.innerHTML = `<input type="date" value="${addDays(1)}" min="${addDays(0)}" aria-label="排程日期"><button>確定</button><button class="no">取消</button>`;
  btn.after(box);
  const inp = box.querySelector('input');
  box.querySelector('button').onclick = () => { if(inp.value){ box.remove(); schedGroup(nos, inp.value); } };
  box.querySelector('.no').onclick = () => box.remove();
  inp.focus();
  try { inp.showPicker(); } catch(e) {}
}
function schedGroup(nos, date){ change(nos, o => { o.sched = date; }, {action:'setSchedule', orderIds:nos, schedDate:date}); }
function rushGroup(nos, on){ change(nos, o => { o.rush = on; }, {action:'setSchedule', orderIds:nos, rush:on}); }
async function shipGroup(nos){
  orders = orders.filter(x => !nos.includes(x.no)); render();

  catch(e){ $('msg').innerHTML = `<div class="msg err">沒存到：${esc(e.message)}</div>`; load(); }
}
