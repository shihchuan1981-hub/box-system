<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工站看板</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1714">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f2ed; --surface:#fff; --ink:#1a1714; --ink-2:#6b6560; --line:#d6cfc4;
  --accent:#c0392b; --ok:#2e7d32; --ok-soft:#eef6ee; --warn:#b7770d; --warn-soft:#fdf6e8; --chip:#ece8e2;
  --sans:'Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;font-weight:900}
.meta{font-size:13px;color:var(--ink-2);display:flex;gap:12px;align-items:center}
.meta a{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;color:var(--ink);text-decoration:none}
.focus{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#1a1714;color:#fff;border-radius:6px;padding:10px 14px}
.focus b{font-size:17px}
.focus button{font:inherit;font-size:14px;font-weight:700;padding:7px 14px;border-radius:5px;border:none;background:#fff;color:#1a1714;cursor:pointer}
.meta button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer}
.stations{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.st{font:inherit;font-size:17px;font-weight:700;padding:12px 4px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.st small{font-size:12px;color:var(--ink-2);font-weight:500}
.st[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.st[aria-pressed="true"] small{color:#ddd}
.msg{padding:10px 14px;border-radius:4px;font-size:14px}
.msg.err{background:#fdf0ef;color:var(--accent);border:1px solid #ef9a9a}
.msg.info{background:var(--warn-soft);color:var(--warn);border:1px solid #f0cf8f}
h2{font-size:30px;margin:0;font-weight:900}
.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.count{font-size:15px;color:var(--ink-2)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card.urgent{border-color:var(--accent);box-shadow:inset 6px 0 0 var(--accent)}
.card.done{opacity:.5}
.row1{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.no{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.todo{background:var(--chip);color:var(--ink-2)}
.pill.doing{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.rush{background:var(--accent);color:#fff}
.pill.kind{background:var(--ink);color:#fff}
.cust{font-size:22px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.prod{font-size:16px;color:var(--ink-2);overflow-wrap:anywhere}
.board{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.flute{font-size:15px;font-weight:700;background:var(--chip);padding:2px 8px;border-radius:4px}
.mat{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--warn)}
.mat.big{font-size:24px}
.lbl{font-family:var(--sans);font-size:12px;color:var(--ink-2);font-weight:500;margin-right:3px}
.specs{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.size{font-family:var(--mono);font-size:18px;font-weight:600;overflow-wrap:anywhere}
.qty{font-size:19px;font-weight:700}
.due{font-size:14px;color:var(--ink-2)}
.due b{color:var(--accent)}
.note{font-size:14px;background:var(--chip);border-radius:4px;padding:6px 8px;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.acts button{font:inherit;font-size:18px;font-weight:700;padding:12px;border-radius:6px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.acts .go-done{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button:disabled{opacity:.4;cursor:wait}
.acts .undo{grid-column:1/-1;font-size:14px;padding:8px;border-color:var(--line);color:var(--ink-2)}
/* 裁切站：要不要印刷 */
.ptag{font-size:20px;font-weight:900;text-align:center;padding:8px;border-radius:6px}
.ptag.yes{background:var(--accent);color:#fff}
.ptag.no{background:var(--chip);color:var(--ink-2)}
/* 印刷站：麥頭文字和照片 */
.mk{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:8px}
.mksec .lbl{display:block;margin-bottom:2px}
.mksec pre{margin:0;font-family:var(--sans);font-size:20px;font-weight:700;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--warn-soft);border-radius:4px;padding:8px 10px}
.mksec.empty{font-size:14px;color:var(--ink-2)}
.mkphoto img{width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.mkphoto.small img{max-height:150px}
.mk details{margin-top:6px;font-weight:500}
.mk details summary{cursor:pointer;font-size:14px}
.mkphoto small{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.mkwarn{font-size:15px;font-weight:700;color:var(--accent);background:#fdf0ef;border:1px solid #ef9a9a;border-radius:4px;padding:8px 10px}
.ph-over{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.ph-over img{max-width:100%;max-height:92vh;object-fit:contain}
.ph-over span{color:#fff;font-size:14px}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.empty{text-align:center;padding:40px;color:var(--ink-2);background:var(--surface);border-radius:8px;border:1px dashed var(--line)}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:680px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--ink-2)}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2),td:nth-child(3),th:nth-child(3),td:nth-child(4),th:nth-child(4){text-align:left}
.mono-s{font-family:var(--mono);font-size:14px;white-space:nowrap}
tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--chip);border:1px solid var(--line)}
.dot.doing{background:var(--warn);border-color:var(--warn)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dash{color:var(--line)}
@media (max-width:700px){.stations{grid-template-columns:repeat(3,1fr)}h2{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>工站看板</h1>
    <div class="meta"><span id="updated">載入中…</span><button onclick="load()">重新整理</button><a href="schedule.html">排程看板</a></div>
  </div>
  <nav class="stations" id="stations"></nav>
  <div id="focusBar"></div>
  <div id="msg"></div>
  <section id="stationView">
    <div class="head"><h2 id="stTitle"></h2><div class="count" id="stCount"></div></div>
    <div class="list" id="list" style="margin-top:10px"></div>
  </section>
  <section class="overview" id="overview" hidden>
    <table><thead><tr id="ovHead"></tr></thead><tbody id="ovBody"></tbody></table>
  </section>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXvT3OkQoOKZ2XmmrtFBKhxg9OuTCphL66klI1sJBeSqczxUuKhCZZKMdzzXN_AqJ3/exec';

// ── 系統密碼：每台裝置第一次輸入，之後記住；密碼錯或換密碼會再問 ──
(function () {
  const K = 'boxSystemKey', orig = window.fetch.bind(window);
  const get = () => { try { return localStorage.getItem(K) || ''; } catch (e) { return ''; } };
  const put = v => { try { v ? localStorage.setItem(K, v) : localStorage.removeItem(K); } catch (e) {} };
  window.fetch = async function (url, opt) {
    if (typeof url !== 'string' || url.indexOf(GAS_URL) !== 0) return orig(url, opt);
    let msg = '';
    for (let t = 0; t < 3; t++) {
      let key = get();
      if (!key) {
        key = (prompt((msg ? msg + '\n\n' : '') + '請輸入工廠系統密碼（這台裝置只要輸入一次）') || '').trim();
        if (!key) throw new Error('沒有輸入密碼，無法讀取資料');
        put(key);
      }
      let u = url, o = opt;
      if (o && o.body) { const b = JSON.parse(o.body); b.key = key; o = Object.assign({}, o, {body: JSON.stringify(b)}); }
      else u = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(key);
      const res = await orig(u, o);
      let d = null; try { d = await res.clone().json(); } catch (e) { return res; }
      if (!d || !d.auth) return res;
      if (get() !== key) { t--; continue; }     // 別的請求剛換好新密碼，直接用新的再試
      put('');
      if (!/密碼錯誤/.test(d.error)) throw new Error(d.error);
      msg = '❌ 密碼錯誤，請再輸入一次';
    }
    throw new Error('密碼錯誤');
  };
})();
const STATIONS = ['裁切','印刷','開槽','釘箱','出貨','外加工'];
const ORDER = [0,1,5,2,3,4];   // 畫面上的排列順序（外加工編號是 5）
const LABEL = {todo:'待做', doing:'進行中', done:'完成'};
const OUT_LABEL = {todo:'待送', doing:'加工中', done:'已回廠'};
const labelOf = (k, s) => (k === 5 ? OUT_LABEL : LABEL)[s];
const $ = id => document.getElementById(id);
let orders = [];
// 每台平板記住自己是哪一站（-1 = 全廠總覽）
const params = new URLSearchParams(location.search);
let focus = params.get('order') ? new Set(params.get('order').split(',')) : null;
const focusTitle = params.get('title') || '';
let cur = (() => {
  const q = params.get('station');
  if (focus && q === null) return -1;          // 從排程看板點進來，先看全廠總覽
  if (q !== null && STATIONS.includes(q)) return STATIONS.indexOf(q);
  if (q === '全廠') return -1;
  try { const v = localStorage.getItem('station'); if (v !== null) return +v; } catch (e) {}
  return -1;
})();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stateOf = (o, s) => o.prog[s] || 'todo';
function readyFor(o, s) { const i = o.route.indexOf(s); return i === 0 || (i > 0 && stateOf(o, o.route[i-1]) === 'done'); }
// ── 印刷站：產品最新的麥頭照片（讀一次就記住，不會每分鐘重讀）──
const pidPhotos = {};   // 產品ID → {id,date} 或 null（沒照片）
const photoData = {};   // 檔案ID → 圖片資料；'' = 讀失敗
let photoBusy = false;
function firstPhoto(s) {
  const x = String(s || '').split('｜').filter(Boolean)[0]; if (!x) return null;
  const i = x.indexOf('@'); return i < 0 ? {id:x, date:''} : {id:x.slice(0, i), date:x.slice(i + 1)};
}
async function loadPhotos() {
  if (cur !== 1 || photoBusy) return;
  const list = shown().filter(o => o.route.includes(1) && stateOf(o, 1) !== 'done');
  const need = [...new Set(list.map(o => o.pid).filter(p => p && pidPhotos[p] === undefined))];
  photoBusy = true;
  try {
    if (need.length) {
      const d = await (await fetch(GAS_URL + '?action=getProductPhotos&ids=' + encodeURIComponent(need.join(',')))).json();
      if (d.success) { need.forEach(p => { pidPhotos[p] = firstPhoto(d.data[p]); }); render(); }
    }
    const ids = [...new Set(list.flatMap(o => [(pidPhotos[o.pid] || {}).id, o.page]).filter(Boolean).filter(id => photoData[id] === undefined))];
    for (const id of ids) {
      try {
        const d = await (await fetch(GAS_URL + '?action=getPhoto&id=' + encodeURIComponent(id))).json();
        photoData[id] = d.success ? d.data : '';
      } catch (e) { photoData[id] = ''; }
      render();
    }
  } catch (e) {}
  photoBusy = false;
}
function showPhoto(id) {
  const u = photoData[id]; if (!u) return;
  const o = document.createElement('div');
  o.className = 'ph-over'; o.onclick = () => o.remove();
  o.innerHTML = `<img src="${u}" alt="麥頭照片"><span>點一下關閉</span>`;
  document.body.appendChild(o);
}
function mkSec(label, text) {
  return String(text || '').trim()
    ? `<div class="mksec"><span class="lbl">${label}</span><pre>${esc(text)}</pre></div>`
    : `<div class="mksec empty"><span class="lbl">${label}</span>（沒填）</div>`;
}
// 一張照片：還在讀、讀不到、讀好了三種狀態
function imgBlock(id, label, small) {
  const u = photoData[id];
  if (u === undefined) return '<div class="mksec empty">照片載入中…</div>';
  if (!u) return '<div class="mkwarn">⚠ 照片讀不到，請按「重新整理」再試</div>';
  return `<div class="mkphoto ${small ? 'small' : ''}"><img src="${u}" alt="${esc(label)}" onclick="showPhoto('${esc(id)}')"><small>${label}・點照片放大</small></div>`;
}
// 印刷站的麥頭：有印好的照片就用印好的；這次訂單的麥頭頁拿來對照；文字和上次不同要提醒
function photoHTML(o) {
  let h = '';
  if (o.markChanged) {
    h += `<div class="mkwarn">⚠ 這次訂單的麥頭文字和上次不一樣，請對照${o.page ? '下面兩張照片' : '照片'}，確認要印哪一種
      <details><summary>看上次的麥頭文字</summary>${mkSec('上次 正嘜', o.prevFront)}${o.type === '內盒' ? '' : mkSec('上次 側嘜', o.prevSide)}</details></div>`;
  }
  const ph = o.pid ? pidPhotos[o.pid] : null;
  if (o.pid && ph === undefined) return h + '<div class="mksec empty">麥頭照片載入中…</div>';
  if (ph) {
    h += imgBlock(ph.id, '印好的麥頭' + (ph.date ? '（' + esc(ph.date) + '拍）' : ''), false);
    if (o.page) h += imgBlock(o.page, '這次訂單的麥頭頁（和上面對照）', true);
    return h;
  }
  if (o.page) return h + imgBlock(o.page, '訂單麥頭頁（這個產品還沒有印好的照片）', false);
  return h + '<div class="mkwarn">⚠ 沒有麥頭照片，請找老闆確認</div>';
}
const byPriority = (a, b) => (b.rush - a.rush) || String(a.dueKey).localeCompare(String(b.dueKey));

async function load() {
  try {
    const res = await fetch(GAS_URL + '?action=getBoard');
    const d = await res.json();
    if (!d.success) throw new Error(d.error || '讀取失敗');
    orders = d.data;
    $('msg').innerHTML = '';
    $('updated').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
  } catch (e) {
    $('msg').innerHTML = `<div class="msg err">連不到試算表：${esc(e.message)}。請確認網路，等一下會自動再試。</div>`;
  }
  render();
}

function pick(i) { cur = i; if (!focus) { try { localStorage.setItem('station', i); } catch (e) {} } render(); }
function clearFocus() { focus = null; history.replaceState(null, '', location.pathname); render(); }
const shown = () => focus ? orders.filter(o => focus.has(o.no)) : orders;

function render() {
  const list = shown();
  $('focusBar').innerHTML = focus ? `<div class="focus"><span>只看這張訂單：<b>${esc(focusTitle)}</b>（今天看板上有 ${list.length} 項）</span><button onclick="clearFocus()">看全部訂單</button></div>` : '';
  if (focus && orders.length && !list.length) $('msg').innerHTML = '<div class="msg info">這張單沒有在今天的看板上：工站看板只顯示排在今天（和之前沒做完）的單。到排程看板按「整張排今天」就會出現。</div>';
  $('stations').innerHTML = ORDER.map(i => {
    const n = STATIONS[i];
    const c = list.filter(o => o.route.includes(i) && stateOf(o, i) !== 'done').length;
    return `<button class="st" aria-pressed="${i === cur}" onclick="pick(${i})">${n}<small>${c} 張未完成</small></button>`;
  }).join('') + `<button class="st" aria-pressed="${cur === -1}" onclick="pick(-1)">全廠<small>${list.length} 張在做</small></button>`;

  $('stationView').hidden = cur === -1;
  $('overview').hidden = cur !== -1;
  if (cur === -1) return renderOverview();

  const mine = list.filter(o => o.route.includes(cur))
    .sort((a, b) => (stateOf(a, cur) === 'done') - (stateOf(b, cur) === 'done') || byPriority(a, b));
  const waiting = mine.filter(o => !readyFor(o, cur) && stateOf(o, cur) !== 'done').length;
  $('stTitle').textContent = STATIONS[cur];
  $('stCount').textContent = `${mine.length} 張・其中 ${waiting} 張還在上一站`;
  if (!mine.length) { $('list').innerHTML = '<div class="empty">這一站目前沒有排程的單</div>'; return; }

  $('list').innerHTML = mine.map(o => {
    const s = stateOf(o, cur), ready = readyFor(o, cur);
    const pill = s === 'todo' && !ready ? '<span class="pill todo">等上一站</span>' : `<span class="pill ${s}">${labelOf(cur, s)}</span>`;
    const kindTag = o.kind !== '釘箱' ? `<span class="pill kind">${esc(o.kind)}</span>` : '';
    const glue = cur === 2 && o.kind === '糊箱' ? '<div class="note"><b>開槽後糊箱</b></div>' : '';
    const acts = s === 'done'
      ? `<button class="undo" onclick="setState('${esc(o.no)}','doing',this)">按錯了，改回${labelOf(cur,'doing')}</button>`
      : `<button onclick="setState('${esc(o.no)}','doing',this)" ${s === 'doing' ? 'disabled' : ''}>${cur === 5 ? '已送出' : '開始'}</button>
         <button class="go-done" onclick="setState('${esc(o.no)}','done',this)">${cur === 5 ? '已回廠' : '完成'}</button>`;
    return `<div class="card ${o.rush && s !== 'done' ? 'urgent' : ''} ${s === 'done' ? 'done' : ''}">
      <div class="row1"><span class="no">${esc(o.no)}</span><span class="pills">${kindTag}${o.rush && s !== 'done' ? '<span class="pill rush">急件</span>' : ''}${pill}</span></div>
      <div class="cust">${esc(o.cust)}</div>
      <div class="prod">${esc(o.prod)}</div>
      <div class="board">${o.flute ? `<span class="flute">${esc(o.flute)}・${o.layer}層</span>` : `<span class="flute">${o.layer}層</span>`}
        ${o.material ? `<span class="mat ${cur === 0 ? 'big' : ''}"><span class="lbl">用料</span>${esc(o.material)}</span>` : ''}</div>
      <div class="specs"><span class="size"><span class="lbl">尺寸</span>${esc(o.size)}</span><span class="qty">${esc(o.qty)}</span></div>
      <div class="due">交貨 <b>${esc(o.due) || '－'}</b></div>
      ${cur === 0 ? `<div class="ptag ${o.print ? 'yes' : 'no'}">${o.print ? '要印刷' : '不印刷'}</div>` : ''}
      ${cur === 1 ? `<div class="mk">${o.type === '內盒' ? mkSec('內盒印刷', o.front) : mkSec('正嘜', o.front) + mkSec('側嘜', o.side)}${photoHTML(o)}</div>` : ''}
      ${o.die ? dieHTML(o) : ''}
      ${glue}${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}
      <div class="acts">${acts}</div>
    </div>`;
  }).join('');
  if (cur === 1) loadPhotos();
}

function renderOverview() {
  $('ovHead').innerHTML = '<th>客戶</th><th>品名</th><th>尺寸</th><th>數量</th>' + ORDER.map(i => `<th>${STATIONS[i]}</th>`).join('') + '<th>交貨</th>';
  const list = [...shown()].sort(byPriority);
  $('ovBody').innerHTML = list.length ? list.map(o => `<tr><td><b>${esc(o.cust)}</b>${o.rush ? ' <span class="pill rush">急</span>' : ''}</td><td>${esc(o.prod)}</td><td class="mono-s">${esc(o.size)||'－'}</td><td>${esc(o.qty)||'－'}</td>${
    ORDER.map(i => o.route.includes(i) ? `<td><span class="dot ${stateOf(o, i)}" title="${labelOf(i, stateOf(o, i))}"></span></td>` : '<td class="dash">—</td>').join('')
  }<td>${esc(o.due)}</td></tr>`).join('') : `<tr><td colspan="11" style="padding:30px;text-align:center;color:var(--ink-2)">目前沒有排程的單。到試算表「訂單紀錄」填上排程日期就會出現。</td></tr>`;
}

// 斬盒／套板的提醒和按鈕：下一步做什麼、補選印刷順序、改備紙方式
function dieHTML(o) {
  const no = esc(o.no), stock = o.source === '庫存裁切', after = o.print && o.timing === '後印';
  const text = cur === 0 ? `庫存紙裁成用料尺寸，裁好${o.route[1] === 1 ? '先送印刷' : '送加工廠'}`
    : cur === 1 ? (after ? '後印：加工回廠後印刷' : '先印：印完送加工廠')
    : cur === 5 ? (stock ? '紙：庫存紙廠內裁切' : o.route[0] === 5 ? '紙：訂紙，紙廠直接送加工廠' : '紙：訂紙，先進廠印刷') + (after ? '・回廠後要印刷' : '') : '';
  let h = text ? `<div class="note"><b>${text}</b></div>` : '';
  if (o.needTiming) h += `<div class="mkwarn">⚠ 還沒選什麼時候印（目前暫排先印）
    <div class="acts"><button onclick="dieOption('${no}',{timing:'先印'})">先印再加工</button><button onclick="dieOption('${no}',{timing:'後印'})">加工回來再印</button></div></div>`;
  const untouched = [0,1,5].every(k => !o.prog[k]);
  if (untouched && cur === o.route[0]) h += `<div class="acts"><button class="undo" onclick="dieOption('${no}',{source:'${stock ? '訂紙' : '庫存裁切'}'})">${stock ? '改回訂紙' : '紙廠來不及 → 改用庫存紙裁切'}</button></div>`;
  return h;
}
async function dieOption(no, opt) {
  if (opt.source && !confirm(opt.source === '庫存裁切' ? '改用庫存紙裁切？會加到裁切站。\n紙廠那邊的訂單要另外取消或確認。' : '改回訂紙？會從裁切站移除。\n請記得跟紙廠訂紙。')) return;
  try {
    const res = await fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(Object.assign({action:'setDieOption', orderId:no}, opt))});
    const d = await res.json();
    if (!d.success) throw new Error(d.error || '寫入失敗');
    await load();
  } catch (e) { $('msg').innerHTML = `<div class="msg err">沒改到：${esc(e.message)}</div>`; }
}

async function setState(no, state, btn) {
  const o = orders.find(x => x.no === no);
  const before = o.prog[cur];
  o.prog[cur] = state; render();           // 先在畫面上更新，師傅不用等
  try {
    const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'updateStation', orderId:no, station:STATIONS[cur], state }) });
    const d = await res.json();
    if (!d.success) throw new Error(d.error || '寫入失敗');
  } catch (e) {
    if (before) o.prog[cur] = before; else delete o.prog[cur];
    render();
    $('msg').innerHTML = `<div class="msg err">沒存到：${esc(e.message)}。請再按一次。</div>`;
  }
}

load();
setInterval(load, 60000);   // 每分鐘自動更新
</script>
</body>
</html>
