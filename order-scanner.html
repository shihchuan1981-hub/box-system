<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{--bg:#f5f2ed;--surface:#fff;--border:#d6cfc4;--ink:#1a1714;--ink-light:#6b6560;--accent:#c0392b;--accent-light:#fdf0ef;--success:#2e7d32;--success-light:#f0f7f0;--tag-bg:#ece8e2;--warning:#b7770d;--warning-light:#fdf8ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--accent)}
header .logo{font-size:20px;font-weight:700;letter-spacing:.05em}
header .sub{font-size:11px;color:#aaa;margin-top:2px}
header .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;padding:3px 10px;border-radius:2px;font-weight:500}
.nav-tabs{display:flex;background:var(--ink);border-bottom:1px solid #333;padding:0 28px}
.nav-tab{padding:10px 18px;font-size:13px;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;transition:.15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.nav-tab:hover{color:#fff}
.nav-tab.active{color:#fff;border-bottom-color:var(--accent)}
.tab-panel{display:none}.tab-panel.active{display:block}
.container{max-width:960px;margin:0 auto;padding:24px 20px 60px}
.upload-zone{border:2px dashed var(--border);border-radius:6px;background:var(--surface);text-align:center;padding:36px 20px;cursor:pointer;transition:.2s;position:relative;margin-bottom:20px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:var(--accent-light)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:32px;margin-bottom:8px}
.upload-zone h3{font-size:14px;font-weight:500;margin-bottom:4px}
.upload-zone p{font-size:12px;color:var(--ink-light)}
.preview-img{max-height:180px;border-radius:4px;border:1px solid var(--border);object-fit:contain;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border:none;border-radius:3px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#a93226}.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-secondary{background:var(--tag-bg);color:var(--ink);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#1b5e20}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{opacity:.85}
.btn-danger{background:var(--surface);color:var(--accent);border:1px solid #ef9a9a}.btn-danger:hover{background:var(--accent-light)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.status-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:4px;font-size:13px;margin-bottom:14px}
.status-bar.loading{background:#fff8e1;color:#795548;border:1px solid #ffe082}
.status-bar.success{background:var(--success-light);color:var(--success);border:1px solid #a5d6a7}
.status-bar.error{background:var(--accent-light);color:var(--accent);border:1px solid #ef9a9a}
.status-bar.warning{background:var(--warning-light);color:var(--warning);border:1px solid #f6cc7a}
.spinner{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:20px;display:none}
.result-card.show{display:block}
.card-header{background:var(--ink);color:#fff;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:5px 5px 0 0}
.card-header h2{font-size:13px;font-weight:500;letter-spacing:.05em}
.order-no{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#f5c518}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.field{padding:13px 18px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.field:nth-child(even){border-right:none}
.field.full{grid-column:1/-1;border-right:none}
.field label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-light);text-transform:uppercase;display:block;margin-bottom:3px}
.field input,.field textarea,.field select{width:100%;border:1px solid transparent;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);outline:none;resize:none;padding:2px 4px;margin:-2px -4px;border-radius:3px;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:var(--accent-light)}
.field select{cursor:pointer}
.sched-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sched-row select,.sched-row input[type=date]{border:1px solid var(--border)!important;padding:6px 8px!important;margin:0!important;width:auto!important;background:#fff!important}
.rush-check{display:inline-flex!important;align-items:center;gap:6px;font-size:14px!important;font-weight:700!important;color:var(--accent)!important;letter-spacing:0!important;margin:0!important;text-transform:none!important}
.rush-check input{width:18px!important;height:18px!important;margin:0!important}
.customer-match{background:var(--success-light);border:1px solid #a5d6a7;border-radius:4px;padding:8px 12px;font-size:12px;color:var(--success);margin-bottom:12px;display:none}
.customer-match.show{display:flex;align-items:center;gap:8px}
.mark-loaded{background:var(--warning-light);border:1px solid #f6cc7a;border-radius:4px;padding:8px 12px;font-size:12px;color:var(--warning);margin-bottom:12px;display:none}
.mark-loaded.show{display:flex;align-items:center;gap:8px}
.multi-nav{background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:12px;color:var(--ink);margin-bottom:12px;display:none;align-items:center;justify-content:space-between}
.type-switch{display:flex;gap:6px;flex-wrap:wrap}
.type-switch button{font-family:inherit;font-size:13px;font-weight:700;padding:5px 12px;border:1.5px solid var(--border);border-radius:4px;background:#fff;color:var(--ink-light);cursor:pointer}
.pr-why{font-size:11px;color:var(--ink-light);margin-left:6px;align-self:center}
.type-switch button.on.pr-yes{border-color:var(--accent);background:var(--accent)}
.type-switch button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.fields-grid.t-outer .g-inner,.fields-grid.t-inner .g-outer,.fields-grid.t-divider .g-isize,.fields-grid.t-die .g-pr-o{display:none}
.g-die{display:none}.fields-grid.t-die .g-die{display:block}
.stk{background:#f6f8fb;border-left:5px solid #9fb3c8}.stk-head{font-size:13px;font-weight:700;color:var(--ink)}
.stk-row{font-size:13px;margin-top:6px;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.stk-row b{font-size:15px}.stk-ok{color:var(--success);font-weight:700}.stk-short{color:var(--warning);font-weight:700}.stk-buy{color:var(--accent);font-weight:700;margin-top:6px;font-size:13px}
.stk-rot{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--warning-light);color:var(--warning);border:1px solid #f6cc7a}
.die-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-light)}
.multi-nav.show{display:flex;flex-wrap:wrap;gap:8px}
.multi-nav > span:last-child{display:flex;gap:6px;flex-wrap:wrap}
.item-chips{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.item-chip{font-size:11px;padding:2px 7px;border-radius:3px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:inherit}
.item-chip.cur{border-color:var(--ink);font-weight:700}
.item-chip.saved{background:var(--success-light);color:var(--success);border-color:#a5d6a7}
.item-chip.skip{text-decoration:line-through;color:var(--ink-light)}
/* 客戶搜尋框 */
.cust-pick{position:relative}
.field .cust-pick input{font-size:16px;font-weight:700;border:1.5px solid var(--border);background:#fff;padding:9px 40px 9px 12px;margin:0;border-radius:4px}
.field .cust-pick input:focus{border-color:var(--accent);background:#fff}
.field .cust-pick input.picked{border-color:var(--success);background:var(--success-light)}
.cust-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;background:none;font-size:20px;color:var(--ink-light);cursor:pointer;display:none;border-radius:50%}
.cust-x.show{display:block}
.cust-x:hover{background:var(--tag-bg)}
.cust-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 2px);z-index:30;background:#fff;border:1px solid var(--border);border-radius:6px;max-height:340px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.cust-list.show{display:block}
.cust-head{padding:6px 12px;font-size:11px;color:var(--ink-light);background:var(--tag-bg);position:sticky;top:0}
.cust-item{padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--tag-bg);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cust-item:last-child{border-bottom:none}
.cust-item:hover,.cust-item.hl{background:var(--accent-light)}
.cust-item b{font-size:15px;font-weight:700}
.cust-item b mark{background:#ffe9a8;color:inherit;border-radius:2px}
.cust-item small{font-size:12px;color:var(--ink-light);white-space:nowrap}
.cust-none{padding:14px 12px;font-size:13px;color:var(--ink-light)}
.cust-suggest{background:var(--warning-light);border:1px solid #f6cc7a;border-radius:4px;padding:10px 12px;font-size:13px;color:var(--warning);margin-top:8px;display:none}
.cust-suggest.show{display:block}
.cust-suggest .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cust-suggest button{font:inherit;font-size:14px;font-weight:700;padding:7px 12px;border:1.5px solid var(--warning);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer}
.cust-suggest button small{font-weight:400;color:var(--ink-light);margin-left:4px}
/* 產品比對 */
.field.pm{background:#faf8f4;border-left:5px solid var(--border)}
.field.pm.ok{border-left-color:var(--success);background:var(--success-light)}
.field.pm.ask{border-left-color:var(--warning);background:var(--warning-light)}
.pm-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pm-title{font-size:13px;font-weight:700}
.pm-title.ok{color:var(--success)}.pm-title.ask{color:var(--warning)}
.pm-info{font-size:13px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-light)}
.pm-info b{font-size:16px;color:var(--ink)}
.pm-info span em{font-style:normal;color:var(--ink);font-weight:700}
.pm-warn{margin-top:6px;font-size:13px;color:var(--accent);font-weight:700}
.pm-cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pm-cand{text-align:left;font:inherit;font-size:14px;padding:9px 12px;border:1.5px solid var(--warning);background:#fff;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pm-cand:hover{background:var(--warning-light)}
.pm-cand small{color:var(--ink-light);font-size:12px}
.pm-btn{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink)}
.pm-btn.go{background:var(--success);border-color:var(--success);color:#fff;font-weight:700}
.field .pm-q{margin:8px 0 0;border:1.5px solid var(--border);background:#fff;padding:8px 10px;font-size:15px;border-radius:4px}
.pm-new{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.field .pm-new input,.field .pm-new select{width:auto;margin:0;border:1px solid var(--border);background:#fff;padding:6px 8px;font-size:14px}
.field .pm-new input{min-width:160px}
.mk-attach{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mk-attach .cam-btn{font-size:14px;padding:9px 14px}
.mk-thumb{width:96px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--border);background:var(--tag-bg);cursor:zoom-in;flex:none}
.pm-photo{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-light)}
.pm-photo .mk-thumb{width:140px;height:105px}
.ph-over{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;cursor:zoom-out}
.ph-over img{max-width:100%;max-height:85vh;border-radius:4px}
.ph-over span{color:#fff;font-size:14px}
.ship-cust{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px;font-weight:700}
.ship-cust input,.ship-search{font-family:inherit;font-size:16px;padding:9px 12px;border:1.5px solid var(--border);border-radius:4px;min-width:240px;flex:1}
.ship-search{width:100%;margin-bottom:6px}
.ship-row{border:1px solid var(--border);border-left:5px solid var(--border);border-radius:6px;padding:12px;margin-top:10px;background:#fff;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ship-row.ok{border-left-color:var(--success)}
.ship-row.done{border-left-color:var(--success);background:var(--success-light)}
.ship-row.ask{border-left-color:var(--warning)}
.ship-main{flex:1;min-width:220px}
.ship-main b{font-size:16px}
.ship-main .sub{font-size:13px;color:var(--ink-light);margin-top:2px}
.ship-photos{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cam-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:700;padding:10px 16px;border-radius:6px;background:var(--ink);color:#fff;cursor:pointer;border:none}
.cam-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cam-btn.busy{opacity:.5;pointer-events:none}
/* 大的儲存鈕，固定在畫面下方 */
#saveRow{position:sticky;bottom:0;z-index:20;background:var(--bg);padding:10px 0;margin-bottom:0;border-top:1px solid var(--border)}
#saveBtn{flex:1 1 100%;justify-content:center;font-size:20px;font-weight:700;padding:18px 20px;border-radius:8px;min-height:64px}
#saveBtn:disabled{background:#9e9e9e;cursor:wait}
#saveBtn.done{background:#1b5e20}
#printBtn,#exportBtn{flex:1;justify-content:center;padding:12px}
#saveAllBtn{font-size:15px!important;padding:9px 16px!important;font-weight:700}
/* 存好／失敗的大提示 */
.big-toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);z-index:200;min-width:260px;max-width:90vw;padding:26px 28px;border-radius:14px;
  color:#fff;font-size:22px;font-weight:700;text-align:center;line-height:1.5;box-shadow:0 12px 40px rgba(0,0,0,.35);opacity:0;transition:.2s;pointer-events:none}
.big-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.big-toast.ok{background:#2e7d32}.big-toast.err{background:#c0392b}
.big-toast .ic{font-size:52px;display:block;line-height:1;margin-bottom:8px}
.big-toast small{display:block;font-size:15px;font-weight:500;margin-top:6px;opacity:.9}
.list-search{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.list-search input{flex:1;min-width:200px;font-family:inherit;font-size:16px;padding:9px 12px;border:1.5px solid var(--border);border-radius:4px;outline:none}
.list-search input:focus{border-color:var(--accent)}
.list-search span{font-size:12px;color:var(--ink-light)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;font-size:13px}
th{background:var(--tag-bg);padding:9px 12px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-light);text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--ink)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-light)}
.tag{display:inline-block;background:var(--tag-bg);color:var(--ink-light);font-size:10px;padding:2px 7px;border-radius:2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.empty-state{text-align:center;padding:36px;color:var(--ink-light);font-size:13px}
.history-section{margin-top:28px}
.history-section h3{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-light);text-transform:uppercase;margin-bottom:10px}
/* Customer DB */
.customer-form{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:20px}
.customer-form.editing{border:2px solid var(--warning);background:var(--warning-light)}
.customer-form h3{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--ink-light);text-transform:uppercase}
.form-group input,.form-group textarea,.form-group select{padding:8px 10px;border:1px solid var(--border);border-radius:3px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);outline:none;transition:.15s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.6;font-size:12px}
.form-group.full{grid-column:1/-1}
.mark-preview{background:var(--tag-bg);border-radius:4px;padding:10px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;white-space:pre-line;line-height:1.8;min-height:60px;margin-top:4px;color:var(--ink)}
.var-hint{font-size:10px;color:var(--ink-light);margin-top:3px}
.ops{display:flex;gap:6px;white-space:nowrap}
@media (max-width:640px){.fields-grid,.form-grid{grid-template-columns:1fr}.field{border-right:none}}
/* Print */
@media print{
  @page{size:A4;margin:12mm 14mm}
  header,.nav-tabs,.upload-zone,#actionRow,.status-bar,#saveRow,.history-section,.result-card,.customer-match,.mark-loaded,.tab-panel:not(#tab-scan){display:none!important}
  #tab-scan{display:block!important}
  #printArea{display:block!important}
  body{background:#fff}
}
#printArea{display:none}
.po-sheet{width:100%;font-family:'Noto Sans TC',sans-serif;color:#111;font-size:13px}
.po-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:14px}
.po-title{font-size:24px;font-weight:900;letter-spacing:.1em}
.po-company{font-size:11px;color:#555;margin-top:3px}
.po-meta{text-align:right;font-size:12px;line-height:1.8}
.po-meta .order-id{font-size:18px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:#c0392b}
.po-grid{display:grid;grid-template-columns:1fr 1fr 1fr;border:1.5px solid #111;border-radius:4px;overflow:hidden;margin-bottom:12px}
.po-cell{padding:9px 12px;border-right:1px solid #ccc;border-bottom:1px solid #ccc}
.po-cell:nth-child(3n){border-right:none}
.po-cell.span2{grid-column:span 2}
.po-cell.span3{grid-column:span 3;border-right:none}
.po-cell-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:#777;text-transform:uppercase;margin-bottom:3px}
.po-cell-value{font-size:15px;font-weight:600;color:#111;line-height:1.3}
.po-cell-value.big{font-size:18px;font-weight:800}
.po-cell-value.red{color:#c0392b}
.po-cell-value.mono{font-family:'IBM Plex Mono',monospace;font-size:13px}
.po-mark-box{border:1.5px solid #111;border-radius:4px;margin-bottom:12px;overflow:hidden}
.po-mark-header{background:#111;color:#fff;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:6px 12px}
.po-mark-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.po-mark-col{padding:12px 14px;border-right:1px solid #ddd;min-height:80px}
.po-mark-col:last-child{border-right:none}
.po-mark-col-title{font-size:9px;font-weight:700;color:#999;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.po-mark-text{font-size:12px;line-height:1.9;white-space:pre-line;font-weight:500}
.po-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
.po-sign-box{border-top:1.5px solid #111;padding-top:6px;font-size:10px;color:#666;height:50px}
.po-notes-box{border:1px solid #ccc;border-radius:4px;padding:10px 14px;margin-bottom:12px;min-height:44px}
.po-notes-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:#777;text-transform:uppercase;margin-bottom:4px}
.po-notes-text{font-size:12px;line-height:1.7;white-space:pre-line}
</style>
</head>
<body>
<header>
  <div><div class="logo">📦 紙箱接單系統</div><div class="sub">整合版 — Google 試算表同步</div></div>
  <div class="badge">AI 驅動</div> <button id="installBtn" class="badge" style="display:none;cursor:pointer;border:none;background:var(--accent)" onclick="installPWA()">📲 安裝App</button>
</header>
<div class="nav-tabs">
  <button class="nav-tab active" onclick="switchTab('scan')">📄 接單辨識</button>
  <button class="nav-tab" onclick="switchTab('customers')">👥 客戶資料庫</button>
  <button class="nav-tab" onclick="switchTab('history')">📋 訂單紀錄</button>
  <button class="nav-tab" onclick="switchTab('photos')">📷 出貨麥頭</button>
</div>

<!-- ══ TAB: 接單辨識 ══ -->
<div class="tab-panel active" id="tab-scan">
<div class="container">
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*,application/pdf">
    <div id="uploadContent">
      <div class="upload-icon">📄</div>
      <h3>點擊上傳或拖曳訂單圖片</h3>
      <p>支援 JPG、PNG、PDF（傳真掃描、拍照皆可）</p>
    </div>
  </div>
  <div id="statusBar" class="status-bar" style="display:none"></div>
  <div class="btn-row" id="actionRow" style="display:none">
    <button class="btn btn-primary" id="analyzeBtn">🔍 開始辨識</button>
    <button class="btn btn-secondary" id="resetBtn">↺ 重新上傳</button>
  </div>

  <div class="customer-match" id="customerMatch">✓ <span id="customerMatchText"></span></div>
  <div class="mark-loaded" id="markLoaded">📋 <span id="markLoadedText"></span></div>
  <div class="multi-nav" id="multiNav">
    <span id="multiNavText"></span>
    <div class="item-chips" id="itemChips"></div>
    <span>
      <button class="btn btn-secondary" style="padding:3px 10px;font-size:11px" onclick="prevItem()">‹ 上一筆</button>
      <button class="btn btn-secondary" style="padding:3px 10px;font-size:11px" onclick="nextItem()">下一筆 ›</button>
      <button class="btn btn-secondary" style="padding:3px 10px;font-size:11px" onclick="skipItem()">✕ 這筆不要</button>
      <button class="btn btn-success" id="saveAllBtn" onclick="saveAll()">☁ 全部一起存</button>
    </span>
  </div>

  <div class="result-card" id="resultCard">
    <div class="card-header">
      <h2>訂單資料</h2>
      <span class="order-no" id="orderNoDisplay"></span>
    </div>
    <div class="fields-grid">
      <div class="field full">
        <label for="f_customer_q">客戶名稱（打名稱、電話或聯絡人都找得到）</label>
        <div class="cust-pick">
          <input id="f_customer_q" autocomplete="off" placeholder="打字搜尋客戶，例如：金岱、7712143、黃先生">
          <input type="hidden" id="f_customer_sel">
          <button type="button" class="cust-x" id="custX" aria-label="清除客戶" onclick="clearCustomer(true)">×</button>
          <div class="cust-list" id="custList" role="listbox"></div>
        </div>
        <div class="cust-suggest" id="custSuggest"></div>
      </div>
      <div class="field"><label>訂單號碼</label><input id="f_order_no" class="mono" placeholder="－"></div>
      <div class="field"><label>訂貨日期</label><input id="f_order_date" placeholder="－"></div>
      <div class="field"><label>交貨日期</label><input id="f_delivery_date" placeholder="－"></div>
      <div class="field"><label>品名 / 型號</label><input id="f_product" placeholder="－"></div>
      <div class="field"><label>這筆是</label>
        <div class="type-switch" id="typeSwitch">
          <button type="button" data-t="outer" onclick="setBoxType('outer',true)">外箱</button>
          <button type="button" data-t="inner" onclick="setBoxType('inner',true)">內盒</button>
          <button type="button" data-t="die" onclick="setBoxType('die',true)">斬盒</button>
          <button type="button" data-t="divider" onclick="setBoxType('divider',true)">隔板</button>
        </div>
      </div>
      <div class="field full g-die"><label>斬盒（紙直接送加工廠，不經裁切、印刷、開槽）</label><div id="dieOpts"></div></div>
      <div class="field full pm g-outer" id="pm_outer" style="display:none"></div>
      <div class="field g-outer"><label><span class="nm-o">外箱</span>數量</label><input id="f_outer_qty" placeholder="－"></div>
      <div class="field g-outer"><label><span class="nm-o">外箱</span>尺寸（長×寬×高 台分）</label><input id="f_outer_size" class="mono" placeholder="－"></div>
      <div class="field g-outer"><label><span class="nm-o">外箱</span>用紙（空白＝自動算）</label><input id="f_outer_material" class="mono" placeholder="－"></div>
      <div class="field full g-outer stk" id="stk_outer" style="display:none"></div>
      <div class="field g-outer g-pr-o"><label><span class="nm-o">外箱</span>印刷（決定要不要排印刷站）</label><div class="type-switch" id="pr_outer"></div></div>
      <div class="field full g-outer"><label><span class="nm-o">外箱</span>麥頭照片（印好的拍一張，正嘜側嘜同一張）</label><div class="mk-attach" id="mk_outer"></div></div>
      <div class="field full pm g-inner" id="pm_inner" style="display:none"></div>
      <div class="field g-inner"><label><span class="nm-i">內盒</span>數量</label><input id="f_inner_qty" placeholder="－"></div>
      <div class="field g-inner g-isize"><label><span class="nm-i">內盒</span>尺寸（長×寬×高 台分）</label><input id="f_inner_size" class="mono" placeholder="－"></div>
      <div class="field g-inner"><label><span class="nm-i">內盒</span>用紙（空白＝自動算）</label><input id="f_inner_material" class="mono" placeholder="－（隔板請填，例如 45×168）"></div>
      <div class="field full g-inner stk" id="stk_inner" style="display:none"></div>
      <div class="field g-inner"><label><span class="nm-i">內盒</span>印刷（決定要不要排印刷站）</label><div class="type-switch" id="pr_inner"></div></div>
      <div class="field full g-inner"><label><span class="nm-i">內盒</span>麥頭照片（印好的拍一張）</label><div class="mk-attach" id="mk_inner"></div></div>
      <div class="field"><label>條碼</label><input id="f_barcode" class="mono" placeholder="－"></div>
      <div class="field"><label>Item No.</label><input id="f_item_no" class="mono" placeholder="－"></div>
      <div class="field full g-outer"><label>正嘜 Front Mark（變數用 [變數名] 標記）</label><textarea id="f_front_mark" rows="5" placeholder="－"></textarea></div>
      <div class="field full g-outer"><label>側嘜 Side Mark（變數用 [變數名] 標記）</label><textarea id="f_side_mark" rows="5" placeholder="－"></textarea></div>
      <div class="field full g-inner"><label><span class="nm-i">內盒</span>印刷（有填＝要經過印刷站）</label><textarea id="f_inner_mark" rows="3" placeholder="－"></textarea></div>
      <div class="field full sched-field">
        <label>排程（存檔時一起排好）</label>
        <div class="sched-row">
          <select id="f_sched" onchange="document.getElementById('f_sched_date').style.display=this.value==='pick'?'inline-block':'none';try{localStorage.setItem('schedPref',this.value==='shipped'?'shipped':'')}catch(e){}">
            <option value="shipped">已出貨（補登舊單，不排程）</option>
            <option value="">先不排</option>
            <option value="today">排今天</option>
            <option value="tomorrow">排明天</option>
            <option value="pick">選日期…</option>
          </select>
          <input type="date" id="f_sched_date" style="display:none">
          <label class="rush-check"><input type="checkbox" id="f_rush"> 急件</label>
        </div>
      </div>
      <div class="field full"><label>印刷 / 特殊備注</label><textarea id="f_notes" rows="3" placeholder="－"></textarea></div>
    </div>
  </div>

  <div class="btn-row" id="saveRow" style="display:none">
    <button class="btn btn-success" id="saveBtn">☁ 儲存到試算表</button>
    <button class="btn btn-primary" id="printBtn">🖨 列印派工單</button>
    <button class="btn btn-secondary" id="exportBtn">⬇ 匯出 CSV</button>
  </div>
  <div id="printArea"></div>
</div>
</div>

<!-- ══ TAB: 客戶資料庫 ══ -->
<div class="tab-panel" id="tab-customers">
<div class="container">
  <div class="customer-form" id="custForm">
    <h3 id="custFormTitle">➕ 新增客戶</h3>
    <div class="form-grid">
      <div class="form-group"><label>客戶名稱 *</label><input id="c_name" placeholder="例：金岱交通器材有限公司"></div>
      <div class="form-group"><label>統一編號</label><input id="c_taxid" placeholder=""></div>
      <div class="form-group"><label>聯絡人</label><input id="c_contact" placeholder=""></div>
      <div class="form-group"><label>電話</label><input id="c_phone" placeholder="(04)787-0550"></div>
      <div class="form-group"><label>傳真</label><input id="c_fax" placeholder=""></div>
      <div class="form-group full"><label>地址</label><input id="c_address" placeholder=""></div>
      <div class="form-group"><label>Logo 備注</label><input id="c_logo" placeholder="例：Logo檔案另附，見桌面資料夾"></div>
      <div class="form-group"><label>備注</label><input id="c_note" placeholder=""></div>
      <div class="form-group full">
        <label>正嘜範本（固定文字直接寫，變數用 [變數名]）</label>
        <textarea id="c_front" rows="6" placeholder="例：&#10;ICHINEN AXESS&#10;P/O NO. [採購單號]&#10;DATE: [日期]&#10;KOBE&#10;C/NO.&#10;MADE IN TAIWAN."></textarea>
        <div class="var-hint">常用變數：[箱號] [料號] [採購單號] [日期] [數量] [淨重] [毛重] [材積] [庫存號]</div>
      </div>
      <div class="form-group full">
        <label>側嘜範本（固定文字直接寫，變數用 [變數名]）</label>
        <textarea id="c_side" rows="6" placeholder="例：&#10;ITEM NO : [料號]&#10;STOCK : [庫存號]&#10;Q'TY : [數量] PCS&#10;N.W. : [淨重] KGS&#10;G.W. : [毛重] KGS&#10;CUFT : [材積]"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-success" id="custSaveBtn" onclick="saveCustomer()">☁ 儲存客戶資料</button>
      <button class="btn btn-secondary" id="custClearBtn" onclick="clearCustForm()">清除</button>
    </div>
    <div id="custStatus" class="status-bar" style="display:none"></div>
  </div>

  <div class="history-section">
    <h3>客戶清單</h3>
    <div class="list-search">
      <input id="custSearch" placeholder="🔍 搜尋客戶名稱、電話、聯絡人…" oninput="renderCustomerList()" autocomplete="off">
      <span id="custCount"></span>
    </div>
    <div id="customerList"><div class="empty-state">載入中...</div></div>
  </div>
</div>
</div>

<!-- ══ TAB: 出貨麥頭 ══ -->
<div class="tab-panel" id="tab-photos">
<div class="container">
  <div class="upload-zone" id="shipZone">
    <input type="file" id="shipFile" accept="image/*,application/pdf">
    <div id="shipContent"><div class="upload-icon">🚚</div><h3>拍或上傳今天簽回的出貨單</h3><p>AI 讀出客戶和品項，再一筆一筆拍麥頭照片（正嘜、側嘜拍在同一張）</p></div>
  </div>
  <div id="shipStatus" class="status-bar" style="display:none"></div>
  <div class="customer-form">
    <div class="ship-cust">客戶 <input id="shipCust" list="custNames" placeholder="沒有出貨單也可以直接選客戶" autocomplete="off"><datalist id="custNames"></datalist><span id="shipInfo" style="font-weight:400;color:var(--ink-light)"></span></div>
    <input class="ship-search" id="shipSearch" placeholder="🔍 搜尋這家客戶的產品（品名或尺寸），加到下面清單" oninput="shipSearchRender()" autocomplete="off">
    <div id="shipSearchRes"></div>
    <div id="shipList"><div class="empty-state">上傳出貨單，或選客戶後搜尋產品</div></div>
  </div>
</div>
</div>

<!-- ══ TAB: 訂單紀錄 ══ -->
<div class="tab-panel" id="tab-history">
<div class="container">
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="loadOrders()">🔄 重新載入</button>
    <button class="btn btn-secondary" id="exportAllBtn">⬇ 匯出 CSV</button>
  </div>
  <div id="ordersStatus" class="status-bar" style="display:none"></div>
  <div class="history-section">
    <h3>訂單紀錄（從 Google 試算表）</h3>
    <div id="ordersList"><div class="empty-state">點「重新載入」取得最新資料</div></div>
  </div>
</div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXvT3OkQoOKZ2XmmrtFBKhxg9OuTCphL66klI1sJBeSqczxUuKhCZZKMdzzXN_AqJ3/exec';

// ── 系統密碼：每台裝置第一次輸入，之後記住；密碼錯或換密碼會再問 ──
(function () {
  const K = 'boxSystemKey', orig = window.fetch.bind(window);
  const get = () => { try { return localStorage.getItem(K) || ''; } catch (e) { return ''; } };
  const put = v => { try { v ? localStorage.setItem(K, v) : localStorage.removeItem(K); } catch (e) {} };
  window.fetch = async function (url, opt) {
    if (typeof url !== 'string' || url.indexOf(GAS_URL) !== 0) return orig(url, opt);
    let msg = '';
    for (let t = 0; t < 3; t++) {
      let key = get();
      if (!key) {
        key = (prompt((msg ? msg + '\n\n' : '') + '請輸入工廠系統密碼（這台裝置只要輸入一次）') || '').trim();
        if (!key) throw new Error('沒有輸入密碼，無法讀取資料');
        put(key);
      }
      let u = url, o = opt;
      if (o && o.body) { const b = JSON.parse(o.body); b.key = key; o = Object.assign({}, o, {body: JSON.stringify(b)}); }
      else u = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(key);
      const res = await orig(u, o);
      let d = null; try { d = await res.clone().json(); } catch (e) { return res; }
      if (!d || !d.auth) return res;
      if (get() !== key) { t--; continue; }     // 別的請求剛換好新密碼，直接用新的再試
      put('');
      if (!/密碼錯誤/.test(d.error)) throw new Error(d.error);
      msg = '❌ 密碼錯誤，請再輸入一次';
    }
    throw new Error('密碼錯誤');
  };
})();

let fileBase64 = null, fileType = null;
let customers = []; // [{id,name,contact,phone,fax,address,taxId,logo,note,frontMark,sideMark}]
let currentCustomer = null;
let editingCust = null;   // 客戶資料庫正在編輯的那一家（null = 新增）
let recent = {};          // 客戶名稱 → {last: 第幾筆訂單, count: 下過幾次單}
let orderRows = [];
let editingOrderId = null;
let recognizedItems = [];
let recognizedIndex = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── Tab ──

// ── GAS helpers ──
async function gasGet(action) {
  const res = await fetch(`${GAS_URL}?action=${action}`);
  const d = await res.json();
  return d.success ? d.data : [];
}
async function gasPost(payload) {
  const res = await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(payload)
  });
  return await res.json();
}

// ═══ 客戶搜尋（接單頁和客戶資料庫共用） ═══
const norm = s => String(s ?? '').toLowerCase().replace(/[\s\-－_()（）#.,，、'’]/g, '');
const digits = s => String(s ?? '').replace(/\D/g, '');

// 打的字和這家客戶有多像：越高排越前面，0 = 不相關
function custScore(c, q) {
  const nq = norm(q); if (!nq) return 0;
  const name = norm(c.name);
  if (name === nq) return 100;
  if (name.startsWith(nq)) return 90;
  if (name.includes(nq)) return 80;
  const dq = digits(q);
  if (dq.length >= 3 && dq.length === nq.length && (digits(c.phone).includes(dq) || digits(c.fax).includes(dq))) return 70;
  if (norm(String(c.id).replace(/^G-/i, '')) === nq) return 65;
  if (norm(c.contact).includes(nq)) return 60;
  if (nq.length >= 2 && [...nq].every(ch => name.includes(ch))) return 40;   // 打「金交通」也找得到金岱交通
  return 0;
}
const recentRank = c => (recent[c.name] ? recent[c.name].last : 0);

function searchCustomers(q, limit) {
  return customers.map(c => ({c, s: custScore(c, q)}))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || recentRank(b.c) - recentRank(a.c) || a.c.name.length - b.c.name.length)
    .slice(0, limit || 9999).map(x => x.c);
}

// 把打的字在名稱裡標黃
function hilite(name, q) {
  const nq = String(q || '').trim();
  const i = nq ? name.indexOf(nq) : -1;
  if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + nq.length)) + '</mark>' + esc(name.slice(i + nq.length));
}

let listItems = [], hlIndex = -1;
function renderPickList() {
  const q = $('f_customer_q').value.trim();
  const box = $('custList');
  let head = '';
  if (!customers.length) {
    box.innerHTML = '<div class="cust-none">客戶資料還在載入，請稍等一下…</div>';
    box.classList.add('show'); return;
  }
  if (!q) {
    listItems = customers.filter(c => recent[c.name]).sort((a, b) => recentRank(b) - recentRank(a)).slice(0, 15);
    head = listItems.length ? `最近下過單的客戶（共 ${customers.length} 家，打字可搜尋全部）` : `共 ${customers.length} 家客戶，請打字搜尋`;
  } else {
    listItems = searchCustomers(q, 40);
    head = listItems.length ? `找到 ${listItems.length >= 40 ? '40 家以上' : listItems.length + ' 家'}` : '';
  }
  hlIndex = q && listItems.length ? 0 : -1;
  box.innerHTML = (head ? `<div class="cust-head">${head}</div>` : '') +
    (listItems.length
      ? listItems.map((c, i) => `<div class="cust-item${i === hlIndex ? ' hl' : ''}" role="option" data-i="${i}"><b>${hilite(c.name, q)}</b><small>${esc(c.phone || c.contact || '')}</small></div>`).join('')
      : (q ? `<div class="cust-none">找不到「${esc(q)}」。換個字試試，或到「客戶資料庫」新增。</div>` : ''));
  box.classList.add('show');
}
function hidePickList() { $('custList').classList.remove('show'); }
function moveHl(d) {
  if (!listItems.length) return;
  hlIndex = (hlIndex + d + listItems.length) % listItems.length;
  document.querySelectorAll('#custList .cust-item').forEach((el, i) => el.classList.toggle('hl', i === hlIndex));
  const el = document.querySelector('#custList .cust-item.hl'); if (el) el.scrollIntoView({block:'nearest'});
}

(function initPicker() {
  const inp = $('f_customer_q');
  inp.addEventListener('focus', () => { inp.select(); renderPickList(); });
  inp.addEventListener('input', () => {
    if (currentCustomer && inp.value !== currentCustomer.name) unpickCustomer();
    renderPickList();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveHl(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveHl(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (listItems[hlIndex]) { setCustomer(listItems[hlIndex].id, true); inp.blur(); } }
    else if (e.key === 'Escape') { hidePickList(); inp.blur(); }
  });
  inp.addEventListener('blur', () => setTimeout(() => {
    hidePickList();
    if (currentCustomer && inp.value !== currentCustomer.name) inp.value = currentCustomer.name;
  }, 150));
  // 用 mousedown 選，才不會被 blur 搶先關掉清單
  $('custList').addEventListener('mousedown', e => {
    e.preventDefault();
    const it = e.target.closest('.cust-item'); if (!it) return;
    setCustomer(listItems[+it.dataset.i].id, true);
    inp.blur();
  });
})();

// 選定客戶。loadMarks=true 會把這家的麥頭範本帶進正嘜、側嘜
function setCustomer(id, loadMarks) {
  const c = customers.find(x => x.id === id); if (!c) return;
  currentCustomer = c;
  $('f_customer_sel').value = c.id;
  $('f_customer_q').value = c.name;
  $('f_customer_q').classList.add('picked');
  $('custX').classList.add('show');
  $('custSuggest').classList.remove('show');
  hidePickList();
  $('customerMatch').classList.add('show');
  $('customerMatchText').textContent = `已選擇：${c.name}`;
  if (loadMarks && (c.frontMark || c.sideMark)) {
    $('f_front_mark').value = c.frontMark || '';
    $('f_side_mark').value = c.sideMark || '';
    $('markLoaded').classList.add('show');
    $('markLoadedText').textContent = '麥頭範本已載入，請填入各 [變數] 的實際數值';
  } else if (loadMarks) {
    $('markLoaded').classList.remove('show');
  }
  refreshProducts();
}
// 取消已選的客戶，但保留打的字
function unpickCustomer() {
  currentCustomer = null;
  $('f_customer_sel').value = '';
  $('f_customer_q').classList.remove('picked');
  $('custX').classList.toggle('show', !!$('f_customer_q').value);
  $('customerMatch').classList.remove('show');
  $('markLoaded').classList.remove('show');
  pmErr = ''; renderPM();
}
function clearCustomer(focus) {
  $('f_customer_q').value = '';
  unpickCustomer();
  $('custX').classList.remove('show');
  $('custSuggest').classList.remove('show');
  if (focus) $('f_customer_q').focus();
}

// ── AI 讀到的客戶名稱 → 找資料庫裡最像的 ──
const SUFFIX = /(股份有限公司|有限公司|股份公司|股公司|企業社|實業社|工業社|事業|企業|實業|工業|國際|公司|工廠|廠|行|社)$/;
function coreName(s) {
  let t = norm(s);
  for (let k = 0; k < 4; k++) {
    const u = t.replace(SUFFIX, '');
    if (u === t || u.length < 2) break;
    t = u;
  }
  return t;
}
function bigrams(s) { const a = []; for (let i = 0; i < s.length - 1; i++) a.push(s.slice(i, i + 2)); return a.length ? a : [s]; }
function nameSim(a, b) {
  const x = coreName(a), y = coreName(b);
  if (!x || !y) return 0;
  if (x === y) return 100;
  if (x.length >= 2 && y.length >= 2 && (x.includes(y) || y.includes(x))) return 85;
  const A = bigrams(x), pool = bigrams(y); let hit = 0; const total = A.length + pool.length;
  A.forEach(g => { const k = pool.indexOf(g); if (k >= 0) { hit++; pool.splice(k, 1); } });
  // 再比一個字一個字：AI 看錯一個字（星麒→星騏）也能列出來給老闆點
  const cs = [...y]; let same = 0;
  [...x].forEach(ch => { const k = cs.indexOf(ch); if (k >= 0) { same++; cs.splice(k, 1); } });
  return Math.round(70 * Math.max(2 * hit / total, 0.9 * 2 * same / (x.length + y.length)));
}

function autoMatchCustomer(name) {
  name = String(name || '').trim();
  if (!name || !customers.length) return;
  const ranked = customers.map(c => ({c, s: nameSim(name, c.name)}))
    .filter(x => x.s >= 30)
    .sort((a, b) => b.s - a.s || recentRank(b.c) - recentRank(a.c));
  const top = ranked[0];
  // 只有一家明顯最像，才自動選；好幾家一樣像就讓老闆點
  if (top && top.s >= 85 && (!ranked[1] || ranked[1].s < top.s)) { setCustomer(top.c.id, true); return; }
  const box = $('custSuggest');
  if (ranked.length) {
    box.innerHTML = `AI 讀到客戶「<b>${esc(name)}</b>」，請點正確的那一家：<div class="chips">${
      ranked.slice(0, 5).map(x => `<button type="button" onclick="setCustomer('${esc(x.c.id).replace(/\\/g,'\\\\')}', true)">${esc(x.c.name)}${x.c.phone ? `<small>${esc(x.c.phone)}</small>` : ''}</button>`).join('')
    }</div>`;
  } else {
    box.innerHTML = `AI 讀到客戶「<b>${esc(name)}</b>」，資料庫裡找不到。請在上面打字搜尋，新客戶請先到「客戶資料庫」新增。`;
    $('f_customer_q').value = name;
    $('custX').classList.add('show');
  }
  box.classList.add('show');
}

// ═══ 產品比對：選好客戶後，從這家的產品資料找同尺寸／同品名 ═══
// 每一筆品項各自記住對到哪個產品（it._pm），換筆、全部一起存都不會不見
const prodCache = {};                     // 客戶ID → 這家的產品
const OUTER_KINDS = ['外箱','AB式','上下蓋','斬式','其他'];
const newSlot = () => ({prod:null, picked:false, cands:[], q:'', open:false});
const newPM = () => ({custId:'', outer:newSlot(), inner:newSlot()});
let pm = newPM();                          // 目前畫面這一筆的比對結果
let pmLoading = false, pmErr = '';
const SLOT = {
  outer:{label:'外箱', size:'f_outer_size', mat:'f_outer_material', defKind:'外箱', defLayer:5},
  inner:{label:'內盒', size:'f_inner_size', mat:'f_inner_material', defKind:'內箱', defLayer:3}
};
const FKEY = {f_product:'product', f_outer_size:'outer_size', f_inner_size:'inner_size', f_outer_material:'outer_material',
  f_inner_material:'inner_material', f_front_mark:'front_mark', f_side_mark:'side_mark', f_inner_mark:'inner_mark'};
const sizeKey = s => { const n = String(s || '').match(/\d+(?:\.\d+)?/g); return n && n.length >= 3 ? n.slice(0, 3).map(Number).join('x') : ''; };
const nameKey = s => norm(String(s || '').replace(/(\d)\s*[*xX×]\s*(?=\d)/g, '$1x'));
const matKey = s => (String(s || '').match(/\d+(?:\.\d+)?/g) || []).slice(0, 2).map(Number).join('x');
const dateNum = s => { const m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); return m ? +m[1]*10000 + +m[2]*100 + +m[3] : 0; };
const byRecent = (a, b) => dateNum(b.最後出貨) - dateNum(a.最後出貨) || (+b.出貨次數 || 0) - (+a.出貨次數 || 0);
const aliasesOf = p => [p.品名, ...String(p.其他寫法 || '').split(/[｜|]/)].filter(Boolean);
// 四種品類：外箱、內盒、斬盒（用外箱欄位）、隔板（用內盒欄位）
const isOut = t => t === 'outer' || t === 'die';
const isIn = t => t === 'inner' || t === 'divider';
const defKind = (slot, t = boxType) => slot === 'outer' ? (t === 'die' ? '斬式' : '外箱') : (t === 'divider' ? '隔板' : '內箱');
const defLayer = (slot, t = boxType) => slot === 'outer' && t !== 'die' ? 5 : 3;
const slotName = (slot, t = boxType) => slot === 'outer' ? (t === 'die' ? '斬盒' : '外箱') : (t === 'divider' ? '隔板' : '內盒');
const kindOf = (slot, P = pm, t = boxType) => (P && P[slot].prod && P[slot].prod.箱型) || defKind(slot, t);
const layerOf = (slot, P = pm, t = boxType) => Number(P && P[slot].prod && P[slot].prod.層數) || defLayer(slot, t);
const curItem = () => editingOrderId ? null : recognizedItems[recognizedIndex];
// 讀寫一筆品項的欄位：畫面上這一筆讀表單，其他筆讀資料
const tget = (it, id) => it === curItem() ? $(id).value : (it[FKEY[id]] || '');
const tset = (it, id, v) => { if (it === curItem()) $(id).value = v; else it[FKEY[id]] = v; };
const typeOf = it => it === curItem() ? boxType : (it._type || guessType(it));
const slotsOf = it => { const t = typeOf(it); return isOut(t) ? ['outer'] : isIn(t) ? ['inner'] : ['outer', 'inner']; };

async function loadProducts(c) {
  if (prodCache[c.id]) return prodCache[c.id];
  const res = await fetch(`${GAS_URL}?action=getProducts&custId=${encodeURIComponent(c.id)}&custName=${encodeURIComponent(c.name)}`);
  const d = await res.json();
  if (!d.success) throw new Error(d.error || '讀取產品資料失敗');
  return (prodCache[c.id] = d.data.sort(byRecent));
}

// 越像分數越高：尺寸一樣 60、品名一樣 50、箱型對 +10
function prodScore(p, name, size, slot) {
  let s = 0;
  const sk = sizeKey(size);
  if (sk && sizeKey(p.尺寸) === sk) s += 60;
  const nk = nameKey(name);
  if (nk) {
    const names = aliasesOf(p).map(nameKey);
    if (names.includes(nk)) s += 50;
    else if (names.some(x => x.length >= 3 && nk.length >= 3 && (x.includes(nk) || nk.includes(x)))) s += 25;
  }
  if (p.箱型) s += (slot === 'outer') === OUTER_KINDS.includes(p.箱型) ? 10 : -25;
  return s;
}

// 選好客戶（或換筆）時呼叫：讀這家的產品，把每一筆還沒決定的品項都對一次
async function refreshProducts() {
  const it = curItem();
  pm = it ? (it._pm = it._pm || newPM()) : newPM();
  pmErr = '';
  if (!currentCustomer || editingOrderId) { renderPM(); return; }
  const c = currentCustomer;
  pmLoading = !prodCache[c.id]; renderPM();
  let list;
  try { list = await loadProducts(c); } catch (e) { pmErr = e.message; }
  pmLoading = false;
  if (currentCustomer !== c) return;          // 載入中途換了客戶
  if (list) recognizedItems.forEach(x => matchItem(x, list));
  renderPM();
}

function matchItem(it, list) {
  if (!it) return;
  if (!it._pm || it._pm.custId !== currentCustomer.id) it._pm = Object.assign(newPM(), {custId: currentCustomer.id});
  slotsOf(it).forEach(slot => {
    const st = it._pm[slot];
    if (st.prod || st.picked) return;
    const size = tget(it, SLOT[slot].size).trim();
    const name = it._ai || tget(it, 'f_product').trim();
    if (!size && !name) return;
    const ranked = list.map(p => ({p, s: prodScore(p, name, size, slot)}))
      .filter(x => x.s >= 45)
      .sort((a, b) => b.s - a.s || byRecent(a.p, b.p));
    const top = ranked[0];
    if (top && top.s >= 60 && (!ranked[1] || ranked[1].s <= top.s - 15)) applyTo(it, slot, top.p, false);
    else st.cands = ranked.slice(0, 5).map(x => x.p);
  });
  if (it === curItem()) pm = it._pm;
}

function applyTo(it, slot, p, manual) {
  const st = it._pm[slot];
  st.prod = p; st.picked = manual; st.cands = []; st.open = false; st.q = '';
  if (slot === 'outer' || !it._pm.outer.prod) tset(it, 'f_product', p.品名);
  const S = SLOT[slot], osz = sizeKey(tget(it, S.size));
  if (!osz && p.尺寸) tset(it, S.size, p.尺寸);
  // 尺寸一樣才帶資料庫的用紙；客戶改了尺寸就讓公式重算
  if (!tget(it, S.mat).trim() && p.用紙 && (!osz || osz === sizeKey(p.尺寸))) tset(it, S.mat, slot === 'outer' ? splitMat(p.用紙, tget(it, S.size) || p.尺寸, p.箱型 || '外箱', p.層數 || 5) : p.用紙);
  if (slot === 'outer' && (p.正嘜 || p.側嘜)) { tset(it, 'f_front_mark', p.正嘜 || ''); tset(it, 'f_side_mark', p.側嘜 || ''); }
  if (slot === 'inner' && p.正嘜 && !tget(it, 'f_inner_mark').trim()) tset(it, 'f_inner_mark', p.正嘜);
  // 老闆手動點選的，把 AI 這次讀到的寫法記下來，下次就直接對到
  if (manual && it._ai && !aliasesOf(p).map(nameKey).includes(nameKey(it._ai))) {
    p.其他寫法 = [p.其他寫法, it._ai].filter(Boolean).join('｜');
    gasPost({action:'addAlias', productId:p.產品ID, alias:it._ai}).catch(() => {});
  }
}
function curOrTemp() { const it = curItem(); if (it) { it._pm = pm; return it; } return {_pm: pm}; }
function applyProduct(slot, p, manual) { applyTo(curOrTemp(), slot, p, manual); renderPM(); if (typeof renderChips === 'function' && recognizedItems.length > 1) renderChips(); }
function unmatchProduct(slot) { const st = pm[slot]; st.prod = null; st.picked = true; st.cands = []; st.open = true; renderPM(); }
function pickProduct(slot, id) {
  const p = (prodCache[currentCustomer && currentCustomer.id] || []).find(x => x.產品ID === id);
  if (p) applyProduct(slot, p, true);
}
function openSearch(slot) { pm[slot].open = true; renderPM(); const q = document.querySelector(`#pm_${slot} .pm-q`); if (q) q.focus(); }

function searchProducts(slot, q) {
  const list = prodCache[currentCustomer.id] || [];
  const nk = nameKey(q); if (!nk) return [];
  const fit = p => !!p.箱型 && (slot === 'outer') === OUTER_KINDS.includes(p.箱型);
  return list.filter(p => aliasesOf(p).some(n => nameKey(n).includes(nk)) || nameKey(p.尺寸).includes(nk))
    .sort((a, b) => (fit(b) - fit(a)) || byRecent(a, b)).slice(0, 8);
}

function prodLine(p) {
  return `${esc(p.品名)}<small>${esc([p.箱型, p.尺寸, p.用紙 && '用紙 ' + p.用紙, p.最後出貨 && '上次 ' + p.最後出貨].filter(Boolean).join('・'))}</small>`;
}
function candButtons(slot, list) {

// ═══ 備料建議：用紙 → 找紙板庫存（只建議，不扣庫存） ═══
// 庫存紙寫法：寬×長（長＝波浪方向）；用紙也照這個寫法比
const STK = {waste:0.15, loss:0.03};       // 浪費 15% 以內才建議用；損耗 3%
let stock = [];
async function loadStock() {
  try { const r = await fetch(`${GAS_URL}?action=getStock`); const d = await r.json(); if (d.success && Array.isArray(d.data)) stock = d.data; } catch (e) {}
  renderStock();
}
function stockNeed(slot) {
  const t = boxType;
  if (slot === 'outer' ? !isOut(t) : !isIn(t)) return null;
  const S = SLOT[slot], raw = $(S.mat).value.trim();
  const die = slot === 'outer' && t === 'die';
  const layer = die ? +dieOf(curItem()).layer : layerOf(slot);
  const calc = raw ? '' : (die ? calcMat($(S.size).value, kindOf('outer'), layer) : calcMaterial($(S.size).value, slot));
  const use = raw ? (slot === 'outer' && !die ? splitMat(raw, $(S.size).value, kindOf('outer'), layer) : raw) : calc;
  const m = use.match(/(\d+(?:\.\d+)?)\s*[×xX*]\s*(\d+(?:\.\d+)?)/); if (!m) return null;
  const n = use.match(/×\s*(\d+)\s*張/), per = n ? +n[1] : 1;
  const qty = parseInt(String($(slot === 'outer' ? 'f_outer_qty' : 'f_inner_qty').value).replace(/[^\d]/g, ''), 10) || 0;
  const P = pm[slot] && pm[slot].prod, white = !!(P && /白/.test(P.紙色 || ''));
  return {A:+m[1], B:+m[2], per, qty, need:Math.ceil(qty * per * (1 + STK.loss)), layer, white, die, auto:!raw, split: use !== raw && !!raw};
}
function stockMatch(nd) {
  const out = [];
  stock.forEach(s => {
    const W = +s.寬, L = +s.長, cnt = +s.張數 || 0;
    if (!W || !L || !cnt || +s.層數 !== nd.layer || String(s.保留給 || '').trim()) return;
    if (/白/.test(s.備註 || '') !== nd.white) return;
    [[W, L, false], [L, W, true]].forEach(([w, l, rot]) => {
      const pcs = Math.floor(w / nd.A) * Math.floor(l / nd.B); if (!pcs) return;
      const waste = 1 - pcs * nd.A * nd.B / (W * L);
      if (waste <= STK.waste) out.push({s, pcs, waste, rot, make: pcs * cnt});
    });
  });

  return out.sort((a, b) => (a.rot - b.rot) || (a.waste - b.waste) || String(a.s.入庫日).localeCompare(String(b.s.入庫日)))
    .filter((x, i, arr) => arr.findIndex(y => y.s.庫存ID === x.s.庫存ID) === i).slice(0, 3);
}

    const name = d._type === 'both' ? d.product + (slot === 'outer' ? ' 外箱' : ' 內盒') : d.product;
    const mat = String((slot === 'outer' ? d.outer_material : d.inner_material) || '').replace(/\s*×\s*\d+張$/, '') || calcMat(size, kind, layer);
    const r = await gasPost({action:'saveProduct', product:{'客戶ID':cust.id, '客戶名稱':cust.name, '品名':name, '其他寫法':'', '箱型':kind,
      '尺寸':sizeKey(size).split('x').join('×'), '用紙':mat, '層數':String(layer), '紙色':/W$/i.test(name) ? '白' : '', '印刷':'有印', '備註':'接單附照片時新增'}});
    if (!r.success) throw new Error('建立產品失敗：' + r.error);
    (prodCache[cust.id] = prodCache[cust.id] || []).unshift(r.data);
    d._pm[slot].prod = r.data;
  }
}
function photoHint(e) {
  const m = String((e && e.message) || e || '');
  if (/Failed to fetch|Unexpected token|NetworkError|Load failed|JSON/i.test(m))
    return 'Apps Script 還沒換成新版、或還沒授權雲端硬碟（請照說明執行 authorizeDrive 並部署新版本）；網路斷線也會這樣';
  if (/permission|權限|authoriz/i.test(m)) return '還沒授權雲端硬碟：請到 Apps Script 執行 authorizeDrive';
  if (/storage|quota|空間/i.test(m)) return '雲端硬碟空間滿了';
  return m;
}
// 訂單存好但照片沒傳上去：照片留在這一筆，按「重試上傳」再傳
async function retryPhoto(slot, btn) {
  const it = curItem(); if (!it) return;
  btn.disabled = true; btn.textContent = '上傳中…';
  try {
    const n = await uploadPending({_item: it, _pm: it._pm});
    showStatus('success', n ? '✓ 麥頭照片已上傳' : '這筆還沒對到產品，無法上傳');
    if (n) bigToast(true, '麥頭照片已上傳');
  } catch (e) { showStatus('error', '照片還是傳不上去：' + esc(e.message)); bigToast(false, '照片還是傳不上去', plain(e.message)); }
  renderMk();
}
async function uploadPending(d) {
  const it = d._item; if (!it || !it._photo) return 0;
  let n = 0;
  for (const slot of ['outer', 'inner']) {
    const img = it._photo[slot], p = d._pm && d._pm[slot].prod;
    if (!img || !p) continue;
    let r;
    try { r = await gasPost({action:'uploadPhoto', productId:p.產品ID, image:img}); }
    catch (e) { throw new Error(photoHint(e)); }
    if (!r.success) throw new Error(photoHint(r.error));
    p.照片 = r.data.photo; if (!p.印刷) p.印刷 = '有印';
    photoCache[photoList(p)[0].id] = img;
    it._photo[slot] = null; n++;
  }
  return n;
}

// ═══ 麥頭照片：讀取、顯示、放大 ═══
const photoCache = {};
const photoList = p => String((p && p.照片) || '').split('｜').filter(Boolean).map(x => { const i = x.indexOf('@'); return i < 0 ? {id:x, date:''} : {id:x.slice(0, i), date:x.slice(i + 1)}; });
async function getPhotoURL(id) {
  if (photoCache[id]) return photoCache[id];
  const r = await fetch(`${GAS_URL}?action=getPhoto&id=${encodeURIComponent(id)}`);
  const d = await r.json();
  if (!d.success) throw new Error(d.error || '讀不到照片');
  return (photoCache[id] = d.data);
}
let phSeq = 0;
function photoImg(id, cls) {
  const k = 'ph' + (++phSeq);
  if (!photoCache[id]) setTimeout(() => getPhotoURL(id).then(u => { const el = $(k); if (el) el.src = u; }).catch(() => { const el = $(k); if (el) el.alt = '讀不到照片'; }));
  return `<img id="${k}" class="${cls || 'mk-thumb'}" ${photoCache[id] ? `src="${photoCache[id]}"` : ''} alt="載入中…" onclick="showPhoto('${esc(id)}')">`;
}
function showPhoto(id, label) {
  const o = document.createElement('div');
  o.className = 'ph-over'; o.onclick = () => o.remove();
  o.innerHTML = `<img alt="麥頭照片"><span>點一下關閉</span>`;
  document.body.appendChild(o);
  getPhotoURL(id).then(u => { o.querySelector('img').src = u; }).catch(e => { o.querySelector('span').textContent = '讀不到照片：' + e.message; });
}
// 照片壓縮：長邊 1600、JPEG 品質 0.75，一張約 200KB
function compressImage(file, max = 1600, q = 0.75) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('讀不到這張照片')); };
    img.src = url;
  });
}

// ═══ 出貨麥頭：讀出貨單 → 對產品 → 每筆拍一張 ═══
let ship = {cust:null, items:[]};
function showShip(type, msg) { const el = $('shipStatus'); el.className = 'status-bar ' + type; el.style.display = 'flex'; el.innerHTML = type === 'loading' ? `<div class="spinner"></div><span>${msg}</span>` : `<span>${msg}</span>`; }
async function openPhotos() {

}
function findCustomer(name) {
  name = String(name || '').trim(); if (!name) return null;
  const exact = customers.find(c => c.name === name); if (exact) return exact;
  const r = customers.map(c => ({c, s: nameSim(name, c.name)})).sort((a, b) => b.s - a.s || recentRank(b.c) - recentRank(a.c))[0];
  return r && r.s >= 60 ? r.c : null;
}
async function setShipCustomer(c) {
  ship.cust = c;
  $('shipCust').value = c ? c.name : '';
  if (!c) { renderShip(); return; }
  showShip('loading', `讀取「${esc(c.name)}」的產品資料…`);
  try { await loadProducts(c); $('shipStatus').style.display = 'none'; }
  catch (e) { showShip('error', '讀不到產品資料：' + esc(e.message)); return; }
  ship.items.forEach(it => { if (!it.picked) { it.prod = null; matchShipItem(it); } });
  renderShip(); shipSearchRender();
}
$('shipCust').addEventListener('change', () => {
  const c = findCustomer($('shipCust').value);
  if (!c) { showShip('warning', '找不到這個客戶，請從清單選'); return; }
  if (!ship.cust || ship.cust.id !== c.id) setShipCustomer(c);
});

function matchShipItem(it) {
  const list = prodCache[ship.cust.id] || [];
  const slot = /內/.test(it.kind) ? 'inner' : 'outer';
  const ranked = list.map(p => ({p, s: prodScore(p, it.product, it.size, slot)})).filter(x => x.s >= 45).sort((a, b) => b.s - a.s || byRecent(a.p, b.p));
  const top = ranked[0];
  if (top && top.s >= 60 && (!ranked[1] || ranked[1].s <= top.s - 15)) { it.prod = top.p; it.cands = []; }
  else it.cands = ranked.slice(0, 4).map(x => x.p);
}

$('shipFile').addEventListener('change', () => {

      ship.items = (d.items || []).filter(x => x.product || x.size).map(x => ({product:String(x.product || '').trim(), kind:String(x.kind || '').trim(), size:String(x.size || '').trim(), qty:String(x.qty || ''), prod:null, cands:[], picked:false}));

function addShipProduct(id) {

function pickShip(i, id) {

async function newShipProduct(i, btn) {

async function uploadShipPhoto(i, input) {

async function loadCustomers() {
  if (!customers.length) $('customerList').innerHTML = '<div class="empty-state">載入中...</div>';
  try {
    const rows = await gasGet('getCustomers');
    customers = [];
    rows.slice(1).forEach((r, i) => {
      if (String(r[1] || '').trim()) customers.push({
        id: String(r[0] || ''), name: String(r[1]).trim(), contact: String(r[2] || ''), phone: String(r[3] || ''),
        fax: String(r[4] || ''), address: String(r[5] || ''), taxId: String(r[6] || ''), logo: String(r[7] || ''),
        note: String(r[8] || ''), frontMark: String(r[9] || ''), sideMark: String(r[10] || '')
      });
    });
    renderCustomerList();
    // 已選的客戶資料可能被改過，重新對一次
    if (currentCustomer) {
      const c = customers.find(x => x.id === currentCustomer.id);
      if (c) currentCustomer = c; else unpickCustomer();
    }
  } catch(e) {
    $('customerList').innerHTML = `<div class="empty-state">載入失敗：${esc(e.message)}</div>`;
  }
}

// 從訂單紀錄算出最近下過單的客戶，選單才能把常用的排前面
async function loadRecent() {
  try {
    const rows = await gasGet('getOrders');
    recent = {};
    rows.slice(1).forEach((r, i) => {
      const n = String(r[2] || '').trim(); if (!n) return;
      const o = recent[n] || (recent[n] = {last: 0, count: 0});
      o.last = i + 1; o.count++;
    });
  } catch(e) {}
}

async function saveCustomer() {
  const name = $('c_name').value.trim();
  if (!name) { alert('請填寫客戶名稱'); return; }
  const isEdit = !!editingCust;
  showCustStatus('loading', isEdit ? '更新中...' : '儲存中...');
  const payload = {
    action:'saveCustomer',
    isEdit,
    originalId: isEdit ? editingCust.id : '',
    originalName: isEdit ? editingCust.name : '',
    customerId: isEdit && editingCust.id ? editingCust.id : 'C' + Date.now(),
    name, contact:$('c_contact').value,
    phone:$('c_phone').value,
    fax:$('c_fax').value,
    address:$('c_address').value,
    taxId:$('c_taxid').value,
    logoNote:$('c_logo').value,
    notes:$('c_note').value,
    frontMark:$('c_front').value,
    sideMark:$('c_side').value
  };
  try {
    const r = await gasPost(payload);
    if (r.success) {
      showCustStatus('success', isEdit ? `✓「${name}」已更新` : `✓「${name}」已新增到 Google 試算表`);
      bigToast(true, isEdit ? '客戶已更新' : '客戶已新增', name);
      clearCustForm(true); loadCustomers();
    }
    else showCustStatus('error','儲存失敗：'+r.error);
  } catch(e) { showCustStatus('error','儲存失敗：'+e.message); }
}

function editCustomer(i) {

  editingCust = c;

  $('c_taxid').value = c.taxId || '';
  $('c_contact').value = c.contact || '';
  $('c_phone').value = c.phone || '';
  $('c_fax').value = c.fax || '';
  $('c_address').value = c.address || '';
  $('c_logo').value = c.logo || '';
  $('c_note').value = c.note || '';
  $('c_front').value = c.frontMark || '';
  $('c_side').value = c.sideMark || '';

async function deleteCustomer(i) {
  const c = customers[i];
  if (!c) return;
  if (!confirm(`確定要刪除「${c.name}」嗎？\n\n電話：${c.phone || '－'}\n聯絡人：${c.contact || '－'}\n\n刪除後會從試算表移除（舊的訂單紀錄不受影響）。`)) return;
  showCustStatus('loading', `刪除「${c.name}」中...`);
  window.scrollTo(0, 0);
  try {
    const r = await gasPost({action:'deleteCustomer', customerId: c.id, name: c.name});
    if (r.success) {
      showCustStatus('success', `✓「${c.name}」已刪除`);
      if (editingCust === c) clearCustForm(true);
      if (currentCustomer && currentCustomer.id === c.id) clearCustomer();
      loadCustomers();
    } else showCustStatus('error', '刪除失敗：' + r.error);
  } catch(e) { showCustStatus('error', '刪除失敗：' + e.message); }
}

function clearCustForm(keepStatus) {
  ['c_name','c_taxid','c_contact','c_phone','c_fax','c_address','c_logo','c_note','c_front','c_side'].forEach(id => $(id).value = '');
  editingCust = null;
  $('custForm').classList.remove('editing');

  $('custSaveBtn').innerHTML = '☁ 儲存客戶資料';

function showCustStatus(type,msg) {

function editOrder(orderId) {
  const r = orderRows.find(x => String(x[0]) === orderId);

  $('multiNav').classList.remove('show');
  $('uploadContent').innerHTML = `<div class="upload-icon">✏️</div><h3>編輯模式 — 訂單 ${esc(orderId)}</h3><p>不需要重新上傳圖片，直接修改下方欄位後儲存即可</p>`;
  actionRow.style.display = 'none';
  hideStatus();

  clearCustomer();
  const match = customers.find(c => c.name === String(r[2] || '').trim());

  else if (r[2]) { $('f_customer_q').value = String(r[2]); $('custX').classList.add('show'); }

  // 試算表 R 欄（印刷）放回選項；空白就自動判斷
  const pr = /^(是|y|yes|v|✓|1|true)$/i.test(String(r[17]||'').trim()) ? '是' : (/^(否|n|no|0|false)$/i.test(String(r[17]||'').trim()) ? '否' : '');
  editPrint = {outer:pr, inner:pr};
  // 內盒那列的印刷內容存在麥頭欄，編輯時放回「內盒印刷」
  let t = guessType({product:r[3],outer_size:r[4],outer_qty:r[6],outer_material:r[5],inner_size:r[7],inner_qty:r[9],inner_material:r[8]});
  editOrigForm = String(r[19]||'').trim();

  editDie = {layer:String(r[16]||''), back:editOrigForm==='斬盒釘箱'};

}

async function analyze(){

  try {
    const mt=fileType==='application/pdf'?'application/pdf':(fileType||'image/jpeg');
    const [r]=await Promise.all([gasPost({action:'analyzeOrder', fileBase64, mediaType:mt}), customers.length?null:loadCustomers()]);
    if(!r.success) throw new Error(r.error||'辨識失敗');
    recognizedItems=Array.isArray(r.data)?r.data:[r.data];
    recognizedItems.forEach(it=>{ it._ai=String(it.product||'').trim(); });
    // 同一筆同時有外箱和內盒 → 拆成兩筆（品名後加「外箱」「內盒」）
    recognizedItems = recognizedItems.flatMap(it => guessType(it)!=='both' ? [it] : [
      {...it, _type:'outer', product:(it.product||'')+' 外箱', inner_size:'', inner_qty:'', inner_material:'', inner_sheets:'', inner_mark:''},
      {...it, _type:'inner', product:(it.product||'')+' 內盒', outer_size:'', outer_qty:'', outer_material:'', outer_sheets:'', front_mark:'', side_mark:''}]);
    editingOrderId=null;
    saveBtnState();
    showRecognizedItem(0);
    showStatus('success', recognizedItems.length>1 ? `✓ 辨識完成！共偵測到 ${recognizedItems.length} 筆品項，請逐筆確認後儲存。` : '✓ 辨識完成！請確認資料後儲存。');

  } catch(e){ showStatus('error','辨識失敗：'+e.message); }

}

function showRecognizedItem(idx){

    nav.classList.remove('show');
  }
}
function prevItem(){ if(recognizedIndex>0){ formToItem(); showRecognizedItem(recognizedIndex-1); } }

function goItem(i){ formToItem(); showRecognizedItem(i); }

// 畫面上改過的欄位記回這一筆，換筆或「全部一起存」時才不會不見
function formToItem(){

function itemLabel(it){
  const t = it._type||guessType(it);
  const type = {both:'外+內', inner:'內盒', die:'斬盒', divider:'隔板'}[t] || '外箱';
  return `${type} ${it.product||it.item_no||'?'}`;
}
function renderChips(){
  $('itemChips').innerHTML = recognizedItems.length>1 ? recognizedItems.map((it,i)=>
    `<button class="item-chip ${i===recognizedIndex?'cur':''} ${it._saved?'saved':''} ${it._skip?'skip':''}" onclick="goItem(${i})">${i+1}. ${itemLabel(it).replace(/</g,'&lt;')}${it._saved?' ✓':''}</button>`).join('') : '';

}

// 這筆是外箱、內盒、斬盒、隔板：只顯示該類型的欄位
// （AI 讀到外箱＋內盒寫在同一筆時，辨識完會拆成兩筆）
let boxType='outer';
function guessType(d){
  const nm=String(d.product||'');
  const o=!!((d.outer_size||'')+(d.outer_qty||'')+(d.outer_material||'')).trim();
  const i=!!((d.inner_size||'')+(d.inner_qty||'')+(d.inner_material||'')+(d.inner_mark||'')).trim();
  if (o&&i) return 'both';
  if (/隔板/.test(nm)) return 'divider';
  if (i) return 'inner';
  if (/斬/.test(nm)) return 'die';
  return 'outer';
}
function setBoxType(t, user){
  const prev=boxType;
  boxType=t;
  // 手動從外箱類換到內盒類（或反過來）：數量、尺寸、用紙跟著搬過去，不用重打
  const grp = x => isOut(x)?'o':isIn(x)?'i':'';
  if (user && grp(prev) && grp(t) && grp(prev)!==grp(t)) {
    const [from,to] = grp(t)==='i' ? ['outer','inner'] : ['inner','outer'];
    ['qty','size','material'].forEach(k=>{ const a=$(`f_${from}_${k}`), b=$(`f_${to}_${k}`); if(!b.value.trim() && a.value.trim()){ b.value=a.value; a.value=''; } });
  }
  if (user) setTimeout(()=>rematchCurrent(false));
  const g=document.querySelector('.fields-grid');
  g.classList.toggle('t-outer',isOut(t)); g.classList.toggle('t-inner',isIn(t)); g.classList.toggle('t-divider',t==='divider'); g.classList.toggle('t-die',t==='die');
  document.querySelectorAll('.nm-o').forEach(e=>e.textContent=slotName('outer',t));
  document.querySelectorAll('.nm-i').forEach(e=>e.textContent=slotName('inner',t));
  if (user) setTimeout(()=>{ renderPrint(); renderMk(); renderDie(); });
  document.querySelectorAll('#typeSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}

// ── Save Order ──
// 一筆品項 → 要寫進試算表的列（外箱、內盒都有就拆兩列）
function buildRows(d, id){
  if (isOut(d._type)) Object.assign(d,{inner_size:'',inner_qty:'',inner_material:'',inner_mark:''});
  if (isIn(d._type)) Object.assign(d,{outer_size:'',outer_qty:'',outer_material:'',front_mark:'',side_mark:''});
  const die=dieOf(d._item||null);
  const outerM=d.outer_material||(d._type==='die' ? calcMat(d.outer_size, kindOf('outer',d._pm,'die'), +die.layer) : calcMaterial(d.outer_size,'outer',d._pm,d._type));
  const innerM=d.inner_material||calcMaterial(d.inner_size,'inner',d._pm,d._type);
  // 試算表 T 欄成型方式：斬盒寫「斬盒」（加工好直接出貨）或「斬盒釘箱」（回來釘箱）、隔板寫「平板紙板」
  const form = d._type==='die' ? (die.back ? '斬盒釘箱' : '斬盒') : d._type==='divider' ? '平板紙板' : (editingOrderId && /^(斬盒|斬盒釘箱|平板紙板)$/.test(editOrigForm) ? '' : undefined);
  const dieLayer = d._type==='die' ? {layer:die.layer} : {};
  const sch=getSchedChoice();
  const base={action:'saveOrder', ...(sch.shipped?{status:'已出貨'}:{}), date:d.saved_at, customer:d.customer, delivery:d.delivery_date, notes:d.notes, orderNo:(d.order_no||'').trim(),
    schedDate:sch.date, rush:sch.date!==undefined||sch.rush?sch.rush:undefined};
  const pv = slot => printOf(d._item||null, slot).v;
  const outerRow={...base, ...prodExtra(d._pm,'outer'), print:pv('outer'), product:d.product, outerSize:d.outer_size, outerMaterial:outerM, outerQty:d.outer_qty,
    innerSize:'', innerMaterial:'', innerQty:'', frontMark:d.front_mark, sideMark:d.side_mark, form, ...dieLayer};
  const innerRow={...base, ...prodExtra(d._pm,'inner'), print:pv('inner'), product:d.product, outerSize:'', outerMaterial:'', outerQty:'',
    innerSize:d.inner_size, innerMaterial:innerM, innerQty:d.inner_qty, frontMark:d.inner_mark, sideMark:'', form};
  if (editingOrderId) {
    // 編輯舊訂單：照原本一列更新
    return [{...base, orderId:editingOrderId, product:d.product, outerSize:d.outer_size, outerMaterial:d.outer_size?outerM:'', outerQty:d.outer_qty,
      innerSize:d.inner_size, innerMaterial:(d.inner_size||d.inner_material)?innerM:'', innerQty:d.inner_qty,
      frontMark:isIn(d._type)?d.inner_mark:d.front_mark, sideMark:isIn(d._type)?'':d.side_mark,
      print:editPrint[isIn(d._type)?'inner':'outer']||undefined, form, ...dieLayer}];
  }
  const hasOuter=!!d.outer_size.trim();
  // 隔板這類沒有尺寸、只有用紙和數量的內盒品項，也算內盒
  const hasInner=!!d.inner_size.trim() || (!hasOuter && !!(d.inner_material||d.inner_qty));
  if (hasOuter && hasInner) return [
    {...outerRow, orderId:id+'-1', product:d._pm&&d._pm.outer.prod ? d._pm.outer.prod.品名 : d.product+' 外箱'},
    {...innerRow, orderId:id+'-2', product:d._pm&&d._pm.inner.prod ? d._pm.inner.prod.品名 : d.product+' 內盒'}];
  if (hasInner) return [{...innerRow, orderId:id, product:d._pm&&d._pm.inner.prod ? d._pm.inner.prod.品名 : d.product}];
  return [{...outerRow, orderId:id}];
}
async function postRows(rows){
  let r;
  for (const row of rows) { r=await gasPost(row); if(!r.success) throw new Error(r.error||'儲存失敗'); }
}
function markRecent(name){
  const n = Object.keys(recent).length + 1;
  recent[name] = {last: Math.max(n, ...Object.values(recent).map(o=>o.last+1)), count: ((recent[name]||{}).count||0)+1};
}
function needCustomer(d){
  if(d.customer) return false;
  alert('請先選客戶：在「客戶名稱」打字搜尋，然後點清單裡的那一家。\n新客戶請先到「客戶資料庫」新增。');
  $('f_customer_q').scrollIntoView({block:'center'}); $('f_customer_q').focus(); return true;
}

$('saveBtn').addEventListener('click', async()=>{
  const d=getFormData();
  if(needCustomer(d)) return;
  const isEdit = !!editingOrderId;
  if($('saveBtn').disabled) return;          // 存檔中，避免連按存兩次
  showStatus('loading', isEdit ? '更新試算表中...' : '儲存到 Google 試算表...');
  saveBtnState('busy');
  try{
    if(!isEdit) await ensureProducts(d);
    await postRows(buildRows(d, 'O'+Date.now()));
    markRecent(d.customer); if(!isEdit) markProductsUsed(d._pm); rememberPrint(d._item, d._pm);
    if(!isEdit){ try{ const n=await uploadPending(d); if(n) showStatus('loading','麥頭照片已上傳…'); }catch(pe){ alert('訂單已存好，但麥頭照片上傳失敗：'+pe.message+'\n\n照片還留在這一筆，修好後按「重試上傳」就好，不用重拍。'); setTimeout(renderMk,50); } }
    if (isEdit) {
      showStatus('success','✓ 訂單已更新！');
      editingOrderId=null;
      saveBtnState('done'); bigToast(true,'訂單已更新');
      return;
    }
    const it=recognizedItems[recognizedIndex]; if(it){ formToItem(); it._saved=true; it._skip=false; }
    const total=recognizedItems.length;
    const nextIdx=recognizedItems.findIndex((x,i)=>i>recognizedIndex && !x._saved && !x._skip);
    const savedN = recognizedItems.indexOf(it)+1;
    if (total>1 && nextIdx>=0) {
      showRecognizedItem(nextIdx);
      showStatus('success', `✓ 第 ${savedN} 筆已儲存，已切換到第 ${nextIdx+1} 筆`);
      saveBtnState(); bigToast(true, `第 ${savedN} 筆已存好`, `已切換到第 ${nextIdx+1} 筆`);
    } else {
      if (total>1) renderChips();
      showStatus('success', total>1 ? `✓ 這筆已儲存，${recognizedItems.filter(x=>x._saved).length}/${total} 筆存好了` : '✓ 訂單已儲存到 Google 試算表！');
      saveBtnState('done'); bigToast(true, '已存好', total>1 ? `${recognizedItems.filter(x=>x._saved).length}/${total} 筆存好了` : '已存到 Google 試算表');
    }
  }catch(e){ showStatus('error','儲存失敗：'+e.message); saveBtnState(); bigToast(false,'沒有存成功',plain(e.message)); }
});

// 多筆品項一次全部存（跳過已存、標「不要」的）
async function saveAll(){
  formToItem();
  const d0=getFormData();
  if(needCustomer(d0)) return;
  const todo=recognizedItems.map((it,i)=>i).filter(i=>!recognizedItems[i]._saved && !recognizedItems[i]._skip);
  if(!todo.length) return;
  $('saveAllBtn').disabled=true; saveBtnState('busy');
  const ts=Date.now(); let done=0; const photoFails=[];
  try{
    for (const i of todo){
      showStatus('loading', `儲存中… ${done+1}/${todo.length}`);
      fillForm(recognizedItems[i]);
      const d={...getFormData(), customer:d0.customer, _pm:recognizedItems[i]._pm||null, _item:recognizedItems[i]};
      await ensureProducts(d);
      await postRows(buildRows(d, 'O'+ts+'-'+(i+1)));
      markProductsUsed(d._pm); rememberPrint(d._item, d._pm);
      try{ await uploadPending(d); }catch(pe){ photoFails.push(`第 ${i+1} 筆：${pe.message}`); }
      recognizedItems[i]._saved=true; done++;
    }
    markRecent(d0.customer);
    showRecognizedItem(todo[todo.length-1]);
    showStatus(photoFails.length?'warning':'success', `✓ ${done} 筆都存好了${getSchedChoice().date?'，也排好程了':''}${photoFails.length?`。但有 ${photoFails.length} 張麥頭照片沒上傳成功（${photoFails.join('；')}），可以到「📷 出貨麥頭」補拍`:''}`);
    saveBtnState('done');
    bigToast(true, `${done} 筆都存好了`, photoFails.length ? `但有 ${photoFails.length} 張照片沒傳上去` : '');
  }catch(e){
    showRecognizedItem(todo[done]||recognizedIndex);
    showStatus('error', `存到第 ${done+1} 筆時失敗：${e.message}。已存好的 ${done} 筆不會重複存，再按一次「一起存」即可。`);
    saveBtnState(); bigToast(false, `第 ${done+1} 筆沒存成功`, `已存好 ${done} 筆，再按一次「一起存」即可`);
  }
  renderChips();
}

// ── 日期補年份：「9/29」→「2026/9/29」；交貨月份比訂貨小就算隔年 ──
function normDate(v, ref){
  v=(v||'').toString().trim(); if(!v) return '';
  if(/^\d{4}[\/.-]/.test(v)) return v.replace(/[.-]/g,'/');
  const m=v.match(/^(\d{1,2})[\/.-](\d{1,2})$/); if(!m) return v;
  let y=new Date().getFullYear();
  const r=(ref||'').match(/^(\d{4})\/(\d{1,2})\//);
  if(r){ y=+r[1]; if(+m[1]<+r[2]) y++; }
  return `${y}/${+m[1]}/${+m[2]}`;
}

// ── 排程選項 → 日期字串（yyyy-mm-dd）；「先不排」回傳 undefined，不動原本的排程 ──
function ymd(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function getSchedChoice(){
  const v=$('f_sched').value, rush=$('f_rush').checked;
  const t=new Date(); let date;
  if(v==='today') date=ymd(t);
  else if(v==='tomorrow'){ t.setDate(t.getDate()+1); date=ymd(t); }
  else if(v==='pick') date=$('f_sched_date').value||undefined;
  return {date, rush, shipped: v==='shipped'};
}
function resetSched(){
  let pref=''; try{ pref=localStorage.getItem('schedPref')||''; }catch(e){}
  $('f_sched').value = pref==='shipped' ? 'shipped' : ''; $('f_rush').checked=false;
  $('f_sched_date').style.display='none';
}

// ── Material Calc ──
// AI 讀到的用紙「226×246」+ 張數「2」→「226×246 ×2張」
function joinMaterial(m,n){
  m=(m||'').toString().trim(); if(!m) return '';
  n=parseInt(n,10);
  return n>1 ? `${m} ×${n}張` : m;
}
function parseSize(str){
  if(!str) return null;
  const p=str.replace(/[×xX*\s]/g,'×').split('×').map(s=>parseFloat(s));
  return p.length===3&&p.every(n=>!isNaN(n))?{l:p[0],w:p[1],h:p[2]}:null;
}
// 紙長：三層 +8、五層 +12；紙寬看箱型（AB式 寬×2+高）
const JOIN = 270;   // 一般外箱 長＋寬 超過這個就二片接
// 已經寫好的單張用紙（例如產品資料的 313×606）→ 長＋寬超過 270 的外箱改成「313×309 ×2張」
function splitMat(mat, size, kind, layer) {
  if (kind !== '外箱') return mat;
  const m = String(mat || '').match(/^\s*(\d+(?:\.\d+)?)\s*[×xX*]\s*(\d+(?:\.\d+)?)\s*$/); if (!m) return mat;
  const sz = parseSize(size); if (!sz || sz.l + sz.w <= JOIN) return mat;
  const add = Number(layer) === 3 ? 8 : 12;
  return `${m[1]}×${(+m[2] - add) / 2 + add} ×2張`;
}
function calcMat(size,kind,layer){
  const s=parseSize(size); if(!s) return '';
  const add = Number(layer)===3 ? 8 : 12;
  const w = kind==='內箱'||kind==='斬式' ? s.w+s.h : kind==='AB式' ? 2*s.w+s.h : kind==='上下蓋' ? s.l+2*s.h : s.w+s.h+2;
  const l = kind==='上下蓋' ? s.w+2*s.h : (s.l+s.w)*2+add;
  // 一般外箱 長＋寬 超過 270：用兩張紙接，每張長＝(長＋寬)＋加量（五層 +12、三層 +8，跟單張一樣）
  if (kind==='外箱' && s.l+s.w > JOIN) return `${w}×${s.l+s.w+add} ×2張`;
  return `${w}×${l}`;
}
function calcMaterial(size,type,P,t){ const sl=type==='outer'?'outer':'inner'; return calcMat(size, kindOf(sl,P||pm,t||boxType), layerOf(sl,P||pm,t||boxType)); }
// 試算表的日期讀回來是「2026-10-15T16:00:00.000Z」，換成「2026/10/16」
function fmtD(v){ const s=String(v??'').trim(); if(/^\d{4}-\d{2}-\d{2}T/.test(s)){ const d=new Date(s); if(!isNaN(d)) return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; } return s; }

// 存檔結果用大提示框顯示，看一眼就知道有沒有存成功
let toastTimer=null;
function bigToast(ok, title, sub){
  let t=$('bigToast'); if(!t){ t=document.createElement('div'); t.id='bigToast'; t.className='big-toast'; document.body.appendChild(t); }
  t.className='big-toast '+(ok?'ok':'err');
  t.innerHTML=`<span class="ic">${ok?'✓':'✕'}</span>${title}${sub?`<small>${sub}</small>`:''}`;
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ok?2200:4500);
  if(navigator.vibrate) try{ navigator.vibrate(ok?80:[100,60,100]); }catch(e){}
}
const plain = m => String(m||'').replace(/<[^>]*>/g,'');
function saveBtnState(st){
  const b=$('saveBtn'); if(!b) return;
  b.classList.remove('done'); b.disabled = st==='busy';
  if(st==='busy') b.innerHTML='⏳ 儲存中…請稍等';
  else if(st==='done') { b.classList.add('done'); b.innerHTML='✓ 已儲存（再按一次會再存一筆）'; }
  else b.innerHTML = editingOrderId ? '☁ 更新訂單' : '☁ 儲存到試算表';
}
function showStatus(type,msg){statusBar.className='status-bar '+type;statusBar.style.display='flex';statusBar.innerHTML=type==='loading'?`<div class="spinner"></div><span>${msg}</span>`:`<span>${msg}</span>`;}
function hideStatus(){statusBar.style.display='none';}
